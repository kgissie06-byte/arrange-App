<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no: ピンチズーム無効 / interactive-widget=overlays-content: キーボード表示時にレイアウトを縮めず、キーボードを上に重ねて表示する（縮めるとキーボード開閉のたびに再レイアウトでガタつくため） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>育成管理ツール</title>

<!-- OGP -->
<meta property="og:title" content="育成管理ツール">
<meta property="og:description" content="武将の育成管理・援軍調整サイト">
<meta property="og:type" content="website">
<meta property="og:url" content="https://arrange-app.vercel.app/">
<meta property="og:image" content="https://arrange-app.vercel.app/ogp/ogp.png">

<!-- Twitter(X) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="育成管理ツール">
<meta name="twitter:description" content="武将の育成管理・援軍調整サイト">
<meta name="twitter:image" content="https://arrange-app.vercel.app/ogp/ogp.png">
</head>
<body>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;--card:#FFFDF9;--border:#E8E2D8;--bm:#D4CCBE;
  --t:#2C2C2A;--t2:#6B6460;--t3:#A09890;
  --acc:#634B38;--acc-bg:#EDE5D8;--acc-lt:#FFF5E8;
  --tab:#3C3489;--toast-bg:#3C3489;--toast-c:#EEEDFE;
  --danger:#791F1F;--danger-bg:#FCEBEB;
}
body{font-family:var(--font-sans);color:var(--t);font-size:14px;background:var(--bg)}

/* ===== ログイン画面 ===== */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;overflow-y:auto;transition:padding-top .15s ease}
/* キーボード表示時：中央寄せをやめて上寄せにし、入力欄がキーボードに隠れないようにする */
#login-screen.kb-open{align-items:flex-start;padding-top:max(24px, env(safe-area-inset-top))}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem 1.75rem;width:calc(100% - 2rem);max-width:340px;text-align:center}
.login-box h1{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--t)}
.login-box p{font-size:12px;color:var(--t2);margin-bottom:1.5rem}
.login-box input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--bm);border-radius:10px;background:var(--bg);color:var(--t);font-family:inherit;text-align:center;letter-spacing:2px;margin-bottom:10px}
.login-box input:focus{outline:none;border-color:var(--tab);box-shadow:0 0 0 2px rgba(60,52,137,.12)}
.login-box button{width:100%;padding:10px;font-size:13px;border:none;border-radius:10px;background:var(--acc);color:#FFF8F0;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity .15s}
.login-box button:hover{opacity:.88}
.login-error{font-size:11px;color:var(--danger);margin-top:6px;min-height:16px}
.added-val{font-size:15px;font-weight:600;color:var(--tab);background:var(--acc-bg);border-radius:8px;padding:6px 10px;letter-spacing:.5px}

/* ===== ローディングオーバーレイ ===== */
#loading-overlay{position:fixed;inset:0;background:rgba(247,244,239,.78);z-index:8000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading-overlay.show{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--tab);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--t2)}
.wrap{min-height:100vh;background:var(--bg);padding-bottom:3rem}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:0 1rem;position:sticky;top:0;z-index:80}
.tabs{display:flex;gap:0;overflow-x:auto}
.tab{padding:11px 15px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;transition:color .15s;font-family:inherit}
.tab.active{color:var(--tab);border-bottom-color:var(--tab);font-weight:500}
.tab:hover:not(.active){color:var(--t);background:var(--acc-bg)}
.content{padding:1.125rem 1rem;max-width:920px;margin:0 auto;position:relative}
.page{display:none}.page.active{display:block}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.sec-head h2{font-size:14px;font-weight:500}
.btn{padding:6px 13px;font-size:12px;border:1px solid var(--bm);border-radius:8px;background:var(--card);cursor:pointer;color:var(--t);font-family:inherit;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--acc-bg)}
.btn.pri{background:var(--acc);color:#FFF8F0;border-color:var(--acc)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.danger{color:var(--danger);border-color:#F09595;background:var(--card)}
.btn.danger:hover{background:var(--danger-bg)}
.back-btn{font-size:12px;cursor:pointer;padding:5px 11px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--t2);font-family:inherit;transition:background .15s}
.back-btn:hover{background:var(--acc-bg)}

/* ① 育成入力 */
.grid-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
.grid-chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
#char-grid-edit #lv-panel{grid-column:1/-1;margin-bottom:0}
.m-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 8px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.m-card:hover{border-color:var(--bm);background:var(--acc-lt)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;margin:0 auto 6px}
.m-name{font-size:12px;font-weight:500}.m-sub{font-size:11px;color:var(--t2);margin-top:2px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:9px}
.cc:not(.sel):hover{border-color:var(--bm);background:var(--acc-lt);}.cc.sel{border:1.5px solid var(--tab);background:#f4f4ff}
.cc-search-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cc-search-input{flex:1;padding:6px 10px;font-size:16px;border:1px solid var(--bm);border-radius:8px;background:var(--card);color:var(--t);font-family:inherit}
.cc-name{font-size:12px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-img{width:52px;height:52px;border-radius:8px;flex-shrink:0;object-fit:cover;background:var(--bg);border:1px solid var(--border)}
.cc-img.empty{display:flex;align-items:center;justify-content:center}
.cc-info{flex:1;min-width:0}
/* 画像アップロードUI */
.img-upload-area{border:1.5px dashed var(--bm);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--bg);transition:background .15s;position:relative}
.img-upload-area:hover{background:var(--acc-lt)}
.img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-preview-wrap{position:relative;display:inline-block}
.img-preview{width:80px;height:80px;border-radius:10px;object-fit:cover;border:1px solid var(--border);display:block}
.img-remove-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:20px;text-align:center;padding:0}
.badges{display:flex;gap:3px;flex-wrap:wrap}
.bdg{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:500}
.ex-bdg{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;background:#FDF6E0;color:#7A5E10;border:.5px solid #C89B20}
.panel{margin-top:10px;padding:13px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.pick-label{font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:500}
.pick-btns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.p-btn{padding:4px 9px;font-size:11px;border:1px solid var(--bm);border-radius:7px;background:var(--bg);cursor:pointer;color:var(--t);font-family:inherit;transition:all .15s}
.p-btn:hover{background:var(--acc-bg)}
.p-btn.on-rar-LG3{background:#FFF0D0;color:#412402;border-color:#EF9F27;font-weight:500}
.p-btn.on-rar-LG2{background:#FFF0D0;color:#633806;border-color:#EF9F27;font-weight:500}
.p-btn.on-rar-LG1{background:#FFF0D0;color:#7A4A10;border-color:#EF9F27;font-weight:500}
.p-btn.on-rar-LG {background:#FFF0D0;color:#854F0B;border-color:#EF9F27;font-weight:500}
.p-btn.on-rar-UR {background:#EEEDFE;color:#3C3489;border-color:#7F77DD;font-weight:500}
.p-btn.on-rar-SR {background:#E6F1FB;color:#0C447C;border-color:#378ADD;font-weight:500}
.p-btn.on-rar-R  {background:#E8F4EC;color:#1A5C32;border-color:#4CAF72;font-weight:500}
.p-btn.on-rar-N  {background:#EBEBEB;color:#3C3C3C;border-color:#999999;font-weight:500}
.p-btn.on-rank-top{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-weight:500}
.p-btn.on-rank    {background:#EDE5D8;color:#634B38;border-color:#B4A494;font-weight:500}
.p-btn.on-ex      {background:#FDF6E0;color:#7A5E10;border-color:#C89B20;font-weight:500}
.save-bar{display:flex;justify-content:flex-end;margin-top:1rem;gap:7px}

/* ② 育成検索 */
.search-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.875rem;align-items:center}
.search-row input,.fil-input{flex:1;min-width:130px;padding:7px 10px;font-size:16px;border:1px solid var(--bm);border-radius:8px;background:var(--card);color:var(--t);font-family:inherit}
.fil-sec{margin-bottom:.625rem}
.fil-label{font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:500}
.fil-btns{display:flex;gap:4px;flex-wrap:wrap}
.f-btn{padding:3px 9px;font-size:11px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;color:var(--t2);font-family:inherit;transition:all .15s}
.f-btn:hover{color:var(--t);background:var(--acc-bg)}
.f-btn.on{font-weight:500;color:var(--acc);background:var(--acc-bg);border-color:var(--bm)}
.res-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.res-card.already{opacity:.55;background:var(--bg)}
.res-card.already .res-already-tag{display:inline-block}
.res-already-tag{display:none;font-size:10px;padding:1px 6px;border-radius:10px;background:var(--acc-bg);color:var(--acc);border:.5px solid var(--bm);margin-left:5px}
.av2{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}

/* ③ 援軍表 */
.reinf-wrap{overflow-x:auto;margin-top:.875rem}
.reinf-table{border-collapse:collapse;width:100%}
.reinf-table th,.reinf-table td{border:1px solid var(--border);padding:0;font-size:12px;text-align:left;vertical-align:middle}
.reinf-table th{background:var(--acc-bg);color:var(--acc);font-weight:500;font-size:11px;padding:7px 10px;white-space:nowrap}
.rt-name{min-width:120px;max-width:160px}
.rt-pair{min-width:130px}
.rt-del{width:42px;text-align:center}
.name-cell{cursor:pointer;padding:7px 10px;color:var(--t2);font-style:italic}
.name-cell.filled{color:var(--t);font-style:normal;font-weight:500}
.name-cell:hover{background:var(--acc-lt)}
.pair-cell-inner{display:flex;align-items:center;gap:5px;padding:7px 10px;cursor:pointer;font-size:12px}
.pair-cell-inner:hover{background:var(--acc-lt)}
.pair-sep{color:var(--t3);font-size:11px}
.del-btn{display:flex;align-items:center;justify-content:center;padding:7px 8px;cursor:pointer;color:var(--t3);font-size:14px;transition:color .15s;border-left:1px solid var(--border)}
.del-btn:hover{color:var(--danger);background:var(--danger-bg)}
.add-row-btn{display:flex;align-items:center;gap:6px;margin-top:8px;padding:7px 10px;font-size:12px;color:var(--t2);cursor:pointer;border:1px dashed var(--bm);border-radius:8px;background:none;font-family:inherit;width:100%;transition:background .15s}
.add-row-btn:hover{background:var(--acc-bg);color:var(--t)}

/* キャラ管理 */
.grid-charlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.c-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;position:relative;cursor:pointer;transition:border-color .15s,background .15s}  /* ← position/cursor/transition追記 */
.c-card:hover{border-color:var(--bm);background:var(--acc-lt)}  /* ← 追加 */
.c-card-shukuen-badge{
  position:absolute;top:6px;right:6px;
  width:0;height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-bottom:16px solid #c7b992;
  cursor:default;
}
.c-card-shukuen-badge::after{
  content:'!';position:absolute;top:3px;left: 50%; transform: translateX(-50%);
  font-size:9px;font-weight:900;color:#fff;line-height:1;
}
.sub-tabs{display:flex;gap:5px;margin-bottom:1rem}
.sub-tab{padding:5px 13px;font-size:11px;border:1px solid var(--bm);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--t2);font-family:inherit;transition:all .15s}
.sub-tab.active{background:var(--acc);color:#FFF8F0;border-color:var(--acc)}
.field{margin-bottom:9px}
.field label{display:block;font-size:11px;color:var(--t2);margin-bottom:3px}
.field input,.field select{width:100%;padding:7px 10px;font-size:16px;border:1px solid var(--bm);border-radius:8px;background:var(--bg);color:var(--t);font-family:inherit;box-sizing:border-box}
.field input[type="datetime-local"]{width:1px;min-width:100%;max-width:100%}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(44,34,24,.42);display:flex;align-items:flex-start;justify-content:center;padding-top:48px;z-index:300;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--bm);border-radius:14px;padding:1.125rem;width:calc(100% - 2rem);max-width:480px;margin-bottom:48px}
.modal h3{font-size:14px;font-weight:500;margin-bottom:12px}
.modal-acts{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* 援軍専用検索パネル (full-screen overlay) */
.reinf-search-overlay{position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto;display:flex;flex-direction:column}
.reinf-search-header{background:var(--card);border-bottom:1px solid var(--border);padding:.875rem 1rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.reinf-search-header h3{font-size:13px;font-weight:500;flex:1}
.reinf-search-body{padding:1rem;max-width:680px;width:100%;margin:0 auto;flex:1}
.reinf-search-filters{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:.875rem}
.filter-group-title{font-size:11px;font-weight:500;color:var(--acc);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.reinf-results-list{display:flex;flex-direction:column;gap:6px}
.reinf-res-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.reinf-res-card.already{background:var(--bg);border-color:var(--border);opacity:.6}
.add-to-table-btn{margin-left:auto;flex-shrink:0;padding:5px 11px;font-size:11px;border:1px solid var(--bm);border-radius:7px;background:var(--card);cursor:pointer;color:var(--acc);font-weight:500;font-family:inherit;white-space:nowrap;transition:all .15s}
.add-to-table-btn:hover:not(:disabled){background:var(--acc-bg)}
.add-to-table-btn:disabled{opacity:.4;cursor:default}
.already-tag{font-size:10px;padding:1px 7px;border-radius:10px;background:var(--acc-bg);color:var(--acc);border:.5px solid var(--bm);margin-left:auto;flex-shrink:0}

/* ===== コンボボックス（検索付きドロップダウン） ===== */
.combo-wrap{position:relative;width:100%}
.combo-input{width:100%;padding:7px 32px 7px 10px;font-size:16px;border:1px solid var(--bm);border-radius:8px;background:var(--bg);color:var(--t);font-family:inherit;box-sizing:border-box;cursor:pointer}
.combo-input:focus{outline:none;border-color:var(--tab);box-shadow:0 0 0 2px rgba(60,52,137,.12)}
.combo-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t3);font-size:12px}
.combo-dropdown{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--card);border:1px solid var(--bm);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:600;overflow:hidden;display:none}
.combo-dropdown.open{display:block}
.combo-search-box{padding:8px 10px;border-bottom:1px solid var(--border)}
.combo-search-box input{width:100%;padding:5px 9px;font-size:14px;border:1px solid var(--bm);border-radius:7px;background:var(--bg);color:var(--t);font-family:inherit;box-sizing:border-box}
.combo-search-box input:focus{outline:none;border-color:var(--tab)}
.combo-list{max-height:200px;overflow-y:auto}
.combo-option{padding:8px 12px;font-size:13px;cursor:pointer;color:var(--t);transition:background .1s}
.combo-option:hover,.combo-option.focused{background:var(--acc-lt)}
.combo-option.selected{background:var(--acc-bg);font-weight:500;color:var(--acc)}
.combo-option.combo-empty{color:var(--t3);cursor:default;font-size:12px;text-align:center}
.combo-option.combo-empty:hover{background:transparent}
.empty{color:var(--t3);text-align:center;padding:1.5rem;font-size:12px}
hr.div{border:none;border-top:1px solid var(--border);margin:1.125rem 0}
.toast-fixed{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-c);border-radius:20px;padding:8px 18px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast-fixed.show{opacity:1}

/* ===== トップへ戻るボタン ===== */
#scroll-top-btn{position:fixed;bottom:24px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#FFF8F0;border:none;cursor:pointer;font-size:18px;line-height:40px;text-align:center;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 2px 8px rgba(0,0,0,.22)}
#scroll-top-btn.show{opacity:1;pointer-events:auto}

/* ===== アンケート ===== */
.sv-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.sv-card:hover{border-color:var(--bm);background:var(--acc-lt)}
.sv-card-title{font-size:13px;font-weight:600;color:var(--t);margin-bottom:4px}
.sv-card-meta{font-size:11px;color:var(--t2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sv-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.sv-status.open{background:#E1F5EE;color:#085041;border:.5px solid #1D9E75}
.sv-status.closed{background:var(--acc-bg);color:var(--acc);border:.5px solid var(--bm)}
.sv-pair-item{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;transition:background .15s,border-color .15s;cursor:pointer;user-select:none}
.sv-pair-item:active{opacity:.85}
.sv-pair-item.top{border-color:#C89B20;background:#FDF6E0}
.sv-pair-item.pending{border-color:var(--tab);background:#EEEDFE}
.sv-pair-item.voted{border-color:var(--tab);background:#EEEDFE}
.sv-pair-vote{min-width:36px;text-align:center}
.sv-pair-vote-num{font-size:18px;font-weight:700;color:var(--tab);line-height:1}
.sv-pair-vote-label{font-size:9px;color:var(--t3)}
.sv-pair-names{flex:1;font-size:13px;font-weight:500}
.sv-pair-sub{font-size:11px;color:var(--t2)}
.sv-vote-btn{padding:5px 13px;font-size:12px;border:1px solid var(--tab);border-radius:8px;background:var(--card);cursor:pointer;color:var(--tab);font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap}
.sv-vote-btn:hover{background:#EEEDFE}
.sv-vote-btn.voted{background:var(--tab);color:#fff}
.sv-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;background:var(--card)}
.sv-check.on{background:var(--tab);border-color:var(--tab);color:#fff}
.sv-check.confirmed{background:#1D9E75;border-color:#1D9E75;color:#fff}
/* 投票者ポップアップ */
.sv-voters-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;min-width:240px;max-width:90vw;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.sv-voters-popup-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--t)}
.sv-voters-popup-list{font-size:12px;color:var(--t2);line-height:2}
.sv-voters-popup-close{margin-top:12px;width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-family:inherit;font-size:12px}
.sv-voters-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199}
.sv-pair-rank{font-size:10px;font-weight:700;width:22px;text-align:center;color:var(--t3)}
.sv-pair-rank.rank1{color:#C89B20}
.sv-pair-rank.rank2{color:#A09890}
.sv-pair-rank.rank3{color:#B08060}
/* メンバー選択バナー */
.sv-member-banner{display:flex;align-items:center;gap:10px;background:#EEEDFE;border:1px solid #AFA9EC;border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:12px}
.sv-member-banner-name{font-weight:600;color:var(--tab);flex:1}
.sv-member-change-btn{padding:4px 11px;font-size:11px;border:1px solid #7F77DD;border-radius:7px;background:var(--card);cursor:pointer;color:var(--tab);font-family:inherit;white-space:nowrap}
/* 投票者一覧 */
.sv-voters-section{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
.sv-voters-title{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px}
.sv-voter-row{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:5px}
.sv-voter-name{font-size:12px;font-weight:500;color:var(--t);min-width:64px;flex-shrink:0;padding-top:2px}
.sv-member-sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px;max-height:300px;overflow-y:auto;padding:2px}
/* ===== 宿縁 ===== */
.shukuen-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px}
.shukuen-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.shukuen-dot.gikkyoku{background:#7F77DD}
.shukuen-dot.omote6{background:#1D9E75}
.shukuen-dot.soji{background:#C89B20}
.shukuen-count{font-size:11px;font-weight:500;color:var(--t2);margin-right:6px}
/* 宿縁ピル (検索結果カード内) */
.sh-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.4}
.sh-pill.gikkyoku{background:#EEEDFE;color:#4B44AA;border:.5px solid #AFA9EC}
.sh-pill.omote6{background:#E1F5EE;color:#0E6B55;border:.5px solid #1D9E75}
.sh-pill.soji{background:#FDF6E0;color:#7A5E10;border:.5px solid #C89B20}
.sh-pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sh-pill.gikkyoku .sh-pill-dot{background:#7F77DD}
.sh-pill.omote6 .sh-pill-dot{background:#1D9E75}
.sh-pill.soji .sh-pill-dot{background:#C89B20}
.sh-badge-wrap{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:5px}
/* 宿縁アイコンバッジ（ccカード右上） */
.cc{position:relative}
.shukuen-icon{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:#F0EDE8;color:#9A9088;font-size:11px;font-weight:900;line-height:18px;text-align:center;cursor:pointer;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.12);border:1px solid #D4CCBE;flex-shrink:0;user-select:none}
.shukuen-icon:hover{background:#E8E2D8;color:#6B6460}
/* 宿縁ポップアップ */
.shukuen-popup{position:fixed;background:var(--card);border:1px solid var(--bm);border-radius:10px;padding:9px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:500;min-width:130px;max-width:220px}
.shukuen-popup-title{font-size:10px;color:var(--t2);margin-bottom:5px;font-weight:500}
.shukuen-popup-item{font-size:12px;font-weight:500;color:var(--t);padding:2px 0;display:flex;align-items:center;gap:5px}
.shukuen-popup-item::before{content:'';width:7px;height:7px;border-radius:50%;background:#7F77DD;flex-shrink:0}
.shukuen-member-list{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding:8px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.shukuen-char-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.shukuen-add-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;font-size:11px;border:1px dashed var(--bm);border-radius:7px;background:none;cursor:pointer;color:var(--t2);font-family:inherit;transition:background .15s;margin-top:5px}
.shukuen-add-btn:hover{background:var(--acc-bg);color:var(--t)}
.shukuen-remove-btn{padding:1px 6px;font-size:11px;border:1px solid #F09595;border-radius:6px;background:none;cursor:pointer;color:var(--danger);font-family:inherit;line-height:1.4}
.shukuen-remove-btn:hover{background:var(--danger-bg)}
.shukuen-toggle{display:flex;gap:6px;margin-bottom:8px}
.shukuen-toggle button{padding:4px 12px;font-size:11px;border:1px solid var(--bm);border-radius:20px;background:var(--bg);cursor:pointer;color:var(--t2);font-family:inherit;transition:all .15s}
.shukuen-toggle button.on{background:var(--acc);color:#FFF8F0;border-color:var(--acc)}
/* ===== ログアウトボタン / 管理バー ===== */
.top-action-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:4px 1rem;background:var(--card);border-bottom:1px solid var(--border);font-size:11px;color:var(--t2)}
.logout-btn{padding:3px 11px;font-size:11px;border:1px solid var(--bm);border-radius:20px;background:none;cursor:pointer;color:var(--t2);font-family:inherit;transition:background .15s}
.logout-btn:hover{background:var(--acc-bg);color:var(--t)}
.role-badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.role-badge.admin{background:#EEEDFE;color:#3C3489;border:.5px solid #AFA9EC}
.role-badge.user{background:var(--acc-bg);color:var(--acc);border:.5px solid var(--bm)}
.role-badge.reinf-admin{background:#E8F5E9;color:#2E7D32;border:.5px solid #A5D6A7}
/* ===== 縦画面固定（スマホのみ）===== */
@media screen and (orientation: landscape) and (max-height: 600px) {
  body::before{
    content:'縦画面でご利用ください';

const ALL_RARITIES=['LG3','LG2','LG1','LG','UR','SR','R','N'];
const ALL_RANKS=['全技極','裏技極','技極','表1','表2','表3','表4','表5','表6','裏1','裏2','裏3','裏4','裏5','裏6'];

const RAR_ORDER=['LG3','LG2','LG1','LG','UR','SR','R','N'];
function getRarImplied(r){
  const idx=RAR_ORDER.indexOf(r);
  if(idx<0)return[r];
  return RAR_ORDER.slice(idx);
}

const OMOTE_RANKS=['表1','表2','表3','表4','表5','表6'];
const URA_RANKS=['裏1','裏2','裏3','裏4','裏5','裏6'];
function getRankImplied(r){
  if(r==='全技極') return['全技極','裏技極','技極',...OMOTE_RANKS,...URA_RANKS];
  if(r==='裏技極') return['裏技極',...OMOTE_RANKS,...URA_RANKS];
  if(r==='技極')   return['技極',...OMOTE_RANKS,'裏1'];
  if(OMOTE_RANKS.includes(r)){
    const idx=OMOTE_RANKS.indexOf(r);
    return OMOTE_RANKS.slice(0,idx+1);
  }
  if(URA_RANKS.includes(r)){
    const idx=URA_RANKS.indexOf(r);
    return[...URA_RANKS.slice(0,idx+1),...OMOTE_RANKS];
  }
  return[r];
}

function rarMatchesFilter(memberRar, filterRars){
  if(!filterRars.length) return true;
  return filterRars.some(fr=>{
    const fi=RAR_ORDER.indexOf(fr);
    const mi=RAR_ORDER.indexOf(memberRar);
    return mi>=0&&fi>=0&&mi<=fi;
  });
}

function toggleWithHierarchy(arr, r, impliedFn){
  const implied=impliedFn(r);
  const allOn=implied.every(x=>arr.includes(x));
  if(allOn){
    implied.forEach(x=>{const i=arr.indexOf(x);if(i>=0)arr.splice(i,1);});
  } else {
    implied.forEach(x=>{if(!arr.includes(x))arr.push(x);});
  }
}

function esc(s){return(s||'').replace(/'/g,"\\'");}
function av(i){return AVC[((i%AVC.length)+AVC.length)%AVC.length];}
function ini(n){return n.slice(0,2).toUpperCase();}
function exNumLabel(ex){
  if(!ex||ex==='未所持') return null;
  const m=ex.match(/\d+/);return m?m[0]:null;
}
function exBdg(ex){
  const n=exNumLabel(ex);
  if(!n) return '';
  return `<span class="ex-bdg">EX${n}</span>`;
}
function rarBdg(r){const s=RAR_S[r]||{bg:'#F1EFE8',c:'#5F5E5A',bd:'#B4B2A9'};return`<span class="bdg" style="background:${s.bg};color:${s.c};border:.5px solid ${s.bd}">${r}</span>`;}
function rankBdg(r){const top=TOP_RANKS.includes(r);return`<span class="bdg" style="background:${top?'#EEEDFE':'#F1EFE8'};color:${top?'#3C3489':'#5F5E5A'};border:.5px solid ${top?'#AFA9EC':'#D3D1C7'}">${r}</span>`;}

function summarizeRanks(ranks){
  if(!ranks||!ranks.length) return[];
  if(ranks.includes('全技極')) return['全技極'];
  if(ranks.includes('裏技極')) return['裏技極'];
  const URA_ORDER=['裏6','裏5','裏4','裏3','裏2','裏1'];
  const OMOTE_ORDER=['表6','表5','表4','表3','表2','表1'];
  const topUra=URA_ORDER.find(r=>ranks.includes(r));
  if(ranks.includes('技極')){
    return topUra?['技極',topUra]:['技極'];
  }
  const best=topUra||OMOTE_ORDER.find(r=>ranks.includes(r));
  return best?[best]:[];
}

function renderMembers(){
  const el=document.getElementById('member-list');
  // 状態が「無効」のメンバーは非表示（編集モーダルでは別途全件表示）
  let visible = S.members.filter(m => m.status !== '無効');
  if(_memberFilter === 'ransaki') visible = visible.filter(m => m.role === '乱咲');
  if(_memberFilter === 'tsubomi') visible = visible.filter(m => m.role === '蕾');

  // 表示中メンバー数（フィルタに応じて集計。「すべて」の場合は合計人数）
  const ransakiCount = S.members.filter(m => m.role === '乱咲' && m.status !== '無効').length;
  const tsubomiCount = S.members.filter(m => m.role === '蕾' && m.status !== '無効').length;
  const memberCount = _memberFilter === 'ransaki' ? ransakiCount
    : _memberFilter === 'tsubomi' ? tsubomiCount
    : ransakiCount + tsubomiCount;
  const memberCountLabel = `<div style="grid-column:1/-1;margin:4px 0 2px;font-size:11px;color:var(--t2);font-weight:500">メンバー：${memberCount}人</div>`;

  if(!visible.length){el.innerHTML='<div class="empty">メンバーがいません</div>';return;}
  // ログインメンバーのカードを先頭に固定表示
  let html = '';
  const loginMember = currentMemberId ? S.members.find(m => m.id === currentMemberId) : null;
  if(loginMember && visible.find(m => m.id === loginMember.id)){
    const a = av(S.members.indexOf(loginMember));
    html += `<div style="grid-column:1/-1;margin-bottom:4px;font-size:11px;color:var(--t2);font-weight:500">ログイン中のアカウント</div>`;
    html += `<div class="m-card" style="border-color:var(--tab);background:#f4f4ff" onclick="selectMember(${loginMember.id})">
      <div class="avatar" style="background:${a.bg};color:${a.c}">${ini(loginMember.name)}</div>
      <div class="m-name">${loginMember.name}</div><div class="m-sub">${loginMember.role}</div>
      <div class="m-sub">${loginMember.chars.length}体育成中</div>
    </div>
    ${memberCountLabel}`;
    visible = visible.filter(m => m.id !== loginMember.id);
  }else{
    html += memberCountLabel;
  }
  el.innerHTML=visible.map((m,i)=>{const a=av(S.members.indexOf(m));return`<div class="m-card" onclick="selectMember(${m.id})">
    <div class="avatar" style="background:${a.bg};color:${a.c}">${ini(m.name)}</div>
    <div class="m-name">${m.name}</div><div class="m-sub">${m.role}</div>
    <div class="m-sub">${m.chars.length}体育成中</div>
  </div>`;}).join('');
  el.innerHTML = html + el.innerHTML;

// 直近5件の更新（新規追加・編集）キャラを先頭にピックアップし、残りは読み仮名順で返す
function orderCharsWithRecentPickup(arr,n){
  const withDate=arr.filter(c=>c.updatedAt);
  const recent=[...withDate]
    .sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt))
    .slice(0,n);
  const recentNames=new Set(recent.map(c=>c.name));
  const rest=sortByYomi(arr.filter(c=>!recentNames.has(c.name)));
  return{recent,rest};
}

function romaToHira(s){
  if(!s)return s;
  const t=[['shi','し'],['chi','ち'],['tchi','っち'],['cchi','っち'],['tsu','つ'],['sha','しゃ'],['shu','しゅ'],
  ['sho','しょ'],['cha','ちゃ'],['chu','ちゅ'],['cho','ちょ'],['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],['nya','にゃ'],
  ['nyu','にゅ'],['nyo','にょ'],['hya','ひゃ'],['hyu','ひゅ'],['hyo','ひょ'],['mya','みゃ'],['myu','みゅ'],['myo','みょ'],
  ['rya','りゃ'],['ryu','りゅ'],['ryo','りょ'],['gya','ぎゃ'],['gyu','ぎゅ'],['gyo','ぎょ'],['ja','じゃ'],['ji','じ'],
  ['ju','じゅ'],['jo','じょ'],['bya','びゃ'],['byu','びゅ'],['byo','びょ'],['pya','ぴゃ'],['pyu','ぴゅ'],['pyo','ぴょ'],
  ['fa','ふぁ'],['fu','ふ'],['kka','っか'],['kki','っき'],['kku','っく'],['kke','っけ'],['kko','っこ'],['ssa','っさ'],
  ['ssi','っし'],['ssu','っす'],['sse','っせ'],['sso','っそ'],['tta','った'],['tte','って'],['tto','っと'],['hha','っは'],
  ['hhi','っひ'],['hhu','っふ'],['hhe','っへ'],['hho','っほ'],['mma','っま'],['mmi','っみ'],['mmu','っむ'],['mme','っめ'],
  ['mmo','っも'],['rra','っら'],['rri','っり'],['rru','っる'],['rre','っれ'],['rro','っろ'],['ka','か'],['ki','き'],['ku','く'],
  ['ke','け'],['ko','こ'],['sa','さ'],['si','し'],['su','す'],['se','せ'],['so','そ'],['ta','た'],['ti','ち'],['tu','つ'],
  ['te','て'],['to','と'],['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],['ha','は'],['hi','ひ'],['he','へ'],
  ['ho','ほ'],['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],['ya','や'],['yu','ゆ'],['yo','よ'],['ra','ら'],
  ['ri','り'],['ru','る'],['re','れ'],['ro','ろ'],['wa','わ'],['wo','を'],['nn','ん'],['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],
  ['go','ご'],['za','ざ'],['zi','じ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],['da','だ'],['di','ぢ'],['du','づ'],['de','で'],
  ['do','ど'],['ba','ば'],['bi','び'],['bu','ぶ'],['be','べ'],['bo','ぼ'],['pa','ぱ'],['pi','ぴ'],['pu','ぷ'],['pe','ぺ'],
  ['po','ぽ'],['a','あ'],['i','い'],['u','う'],['e','え'],['o','お']];
  let r='',v=s.toLowerCase();
  while(v.length){let m=false;
    for(const[k,h]of t){if(v.startsWith(k)){
      r+=h;v=v.slice(k.length);
      m=true;break;
    }
  }
  if(!m){
    r+=v[0];v=v.slice(1);
  }
  }
  return r;
}

const SR_OR_BELOW=['SR','R','N'];

function pickRar(r){
  E.pendingRar=r;
  const cd=S.chars.find(x=>x.name===E.charName);
  if(cd && isUrWithLowerRar(cd) && SR_OR_BELOW.includes(r)){
    HIGH_RANKS_BLOCKED.forEach(rank=>{
      const i=E.pendingRanks.indexOf(rank);
      if(i>=0) E.pendingRanks.splice(i,1);
    });
  }
  renderLvPanel();
}

function isUrWithLowerRar(cd){
  if(!cd||!cd.rars) return false;
  return cd.rars.includes('UR') && cd.rars.some(r=>SR_OR_BELOW.includes(r));
}

function pickRank(r){
  const cd=S.chars.find(x=>x.name===E.charName);
  const allowed=cd?cd.ranks:ALL_RANKS;
  const blockedByRar=(cd&&isUrWithLowerRar(cd)&&E.pendingRar&&SR_OR_BELOW.includes(E.pendingRar))
    ?HIGH_RANKS_BLOCKED:[];
  if(_assistMode){
    toggleWithHierarchy(E.pendingRanks,r,v=>getRankImplied(v).filter(x=>allowed.includes(x)&&!blockedByRar.includes(x)));
  } else {
    if(blockedByRar.includes(r)) return;
    const i=E.pendingRanks.indexOf(r);
    if(i>=0) E.pendingRanks.splice(i,1);
    else E.pendingRanks.push(r);
  }
  renderLvPanel();
}
function pickEx(lv){
  E.pendingEx = E.pendingEx===lv ? null : lv;
  renderLvPanel();
}
function getRequiredRanks(pendingRanks, allowedRanks, blockedRanks){
  // 入力補助でチェックが付く項目をすべて列挙する
  // pickRankと同じロジック: 選択中の各ランクのgetRankImplied結果の和集合
  const blocked = blockedRanks || [];
  const required = new Set();
  pendingRanks.forEach(r => {
    getRankImplied(r).filter(x => allowedRanks.includes(x) && !blocked.includes(x)).forEach(x => required.add(x));
  });
  return [...required];
}

async function saveTraining(){
  if(!E.charName){toast('キャラを選んでください');return;}
  if(!E.pendingRar||!E.pendingRanks.length){toast('選択してください');return;}

  // 入力補助ランクバリデーション
  if(E.pendingRar){
    const cd = S.chars.find(x=>x.name===E.charName);
    const allowedRanks = cd ? cd.ranks : ALL_RANKS;
    // SRなど表6・裏6が非表示の場合はHIGH_RANKS_BLOCKEDを検証対象から除く
    const blockedByRar = (cd && isUrWithLowerRar(cd) && SR_OR_BELOW.includes(E.pendingRar))
      ? HIGH_RANKS_BLOCKED : [];
    const effectiveAllowed = allowedRanks.filter(r => !blockedByRar.includes(r));
    const required = getRequiredRanks(E.pendingRanks, effectiveAllowed, blockedByRar);
    if(required){
      const missing = required.filter(r => !E.pendingRanks.includes(r) && !blockedByRar.includes(r));
      if(missing.length){
        toast('未チェック: ' + missing.join('・'));
        return;
      }
    }
  }
  showLoading();
  try{
    const res = await fetch('/api/training', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        memberId:E.memberId,
        charName:E.charName,
        rar:E.pendingRar,
        ranks:E.pendingRanks,
        ex:E.pendingEx||null
      })
    });
    if(!res.ok){
      let msg='保存に失敗しました';
      try{ const data=await res.json(); if(data?.error) msg = typeof data.error==='string' ? data.error : (data.error.message||msg); }catch(_e){}
      if(res.status===401){ msg='ログインが切れています。再度ログインしてください'; }
      toast(msg);
      return;
    }
    await load();
    toast('保存しました');
    E.charName=null; E.pendingRar=null; E.pendingRanks=[]; E.pendingEx=null;
    const cs=document.getElementById('cc-search');if(cs)cs.value='';
    _showUntrainedOnly=false;
    const ub=document.getElementById('cc-untrained-btn');if(ub)ub.classList.remove('on');
    document.getElementById('lv-panel').style.display='none';
    const m=S.members.find(x=>x.id===E.memberId);
    if(m) renderCharGridEdit(m);
  }catch(e){
    toast('エラー');
  } finally {
    hideLoading();
  }
}

    const shBadge=shukuenBadgeHtml(m,cd);

    rows.push({pt, html:`<div class="res-card"><div class="av2" style="background:${a.bg};color:${a.c}">${ini(m.name)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500">${m.name} <span style="font-size:10px;color:var(--t2)">${m.role}</span></div>
      <div style="font-size:10px;color:var(--t2);margin:1px 0">${cd.name}</div>
      <div class="badges" style="margin-top:3px">${rarBdg(c.rar)}${c.ranks?summarizeRanks(c.ranks).map(rankBdg).join(''):''}${c.ex?exBdg(c.ex):''}</div>
      ${shBadge}</div></div>`});
  });});
  rows.sort((a,b)=>b.pt-a.pt);
  if(!rows.length){el.innerHTML='<div class="empty">条件に合うメンバーがいません</div>';return;}
  el.innerHTML=`<div style="font-size:11px;color:var(--t2);margin-bottom:7px">${rows.length}件</div>`+rows.map(r=>r.html).join('');
}

/* ---------- 援軍表の印刷（画像保存） ---------- */
async function printReinfTable(){
  const tbl = document.getElementById('reinf-table');
  if(!tbl || !tbl.querySelector('tbody tr')){ toast('保存する行がありません'); return; }
  if(typeof html2canvas === 'undefined'){ toast('画像生成ライブラリの読み込みに失敗しました。通信環境を確認してください'); return; }
  showLoading();
  try{
    const canvas = await html2canvas(tbl, { backgroundColor:'#FFFDF9', scale:2 });
    await new Promise(resolve=>{
      canvas.toBlob(blob=>{
        if(!blob){ resolve(); return; }
        const url = URL.createObjectURL(blob);
        const label = _activeReinfTable === 'ransaki' ? '乱咲' : '蕾';
        const d = new Date();
        const pad = n => String(n).padStart(2,'0');
        const fname = `援軍表_${label}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.png`;
        const a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 3000);
        resolve();
      }, 'image/png');
    });
    toast('画像として保存しました');
  } catch(err){
    console.error(err);
    toast('画像の生成に失敗しました');
  } finally {
    hideLoading();
  }
}

/* ---------- 援軍表のコピー（スプレッドシート/Excel貼り付け用） ---------- */
async function copyReinfTable(){
  const rows = S.reinf.filter(r => (r.tableType || 'ransaki') === _activeReinfTable);
  if(!rows.length){ toast('コピーする行がありません'); return; }

  const escapeHtmlCell = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pairText = (main,sub) => {
    if(!main && !sub) return '';
    return sub ? `${main}-${sub}` : main;
  };

  const header = ['name','通常','城'];
  const dataRows = rows.map(row => [
    row.memberName || '',
    pairText(row.normalMain, row.normalSub),
    pairText(row.castleMain, row.castleSub)
  ]);

  const tsvText = [header, ...dataRows].map(r => r.join('\t')).join('\n');

  let htmlTable = '<table><thead><tr>' +
    header.map(h => `<th>${escapeHtmlCell(h)}</th>`).join('') +
    '</tr></thead><tbody>';
  dataRows.forEach(r => {
    htmlTable += '<tr>' + r.map(v => `<td>${escapeHtmlCell(v)}</td>`).join('') + '</tr>';
  });
  htmlTable += '</tbody></table>';

  try{
    if(navigator.clipboard && window.ClipboardItem){
      const item = new ClipboardItem({
        'text/plain': new Blob([tsvText], { type:'text/plain' }),
        'text/html': new Blob([htmlTable], { type:'text/html' })
      });
      await navigator.clipboard.write([item]);
    } else {
      await navigator.clipboard.writeText(tsvText);
    }
    toast('コピーしました（スプレッドシート等に貼り付け可能です）');
  } catch(err){
    console.error(err);
    try{
      await navigator.clipboard.writeText(tsvText);
      toast('コピーしました');
    } catch(err2){
      toast('コピーに失敗しました');
    }
  }
}

/* ========== コンボボックス（検索付きドロップダウン） ========== */
function buildComboOptions(chars, selected) {
  return [
    { value: '', label: '（なし）' },
    ...sortByYomi(chars).map(c => ({ value: c.name, label: c.name, yomi: c.yomi || '' }))
  ];
}

function comboHtml(id, chars, selected, placeholder) {
  const label = selected ? selected : placeholder || '選択してください';
  return `<div class="combo-wrap" id="combo-wrap-${id}">
    <div class="combo-input" id="combo-display-${id}" onclick="toggleCombo('${id}')">${label}</div>
    <span class="combo-arrow">▼</span>
    <div class="combo-dropdown" id="combo-dropdown-${id}">
      <div class="combo-search-box">
        <input type="text" placeholder="名前・読みで絞り込み..." oninput="filterCombo('${id}',this.value)" autocomplete="off" id="combo-search-${id}">
      </div>
      <div class="combo-list" id="combo-list-${id}">
        ${renderComboOptions(id, chars, selected, '')}
      </div>
    </div>
    <input type="hidden" id="${id}" value="${selected||''}">
  </div>`;
}

function renderComboOptions(id, chars, selected, q) {
  const opts = buildComboOptions(chars, selected);
  const filtered = q
    ? opts.filter(o => !o.value || o.label.includes(q) || o.yomi.includes(q))
    : opts;
  if (!filtered.length) return '<div class="combo-option combo-empty">該当なし</div>';
  return filtered.map(o =>
    `<div class="combo-option${o.value === selected ? ' selected' : ''}" data-value="${o.value}" onclick="selectComboOption('${id}','${esc(o.value)}','${esc(o.label)}')">${o.label}</div>`
  ).join('');
}

const _comboState = {};

function toggleCombo(id) {
  const dd = document.getElementById(`combo-dropdown-${id}`);
  if (!dd) return;
  const isOpen = dd.classList.contains('open');
  // 他を全部閉じる
  document.querySelectorAll('.combo-dropdown.open').forEach(el => {
    el.classList.remove('open');
  });
  if (!isOpen) {
    dd.classList.add('open');
    const si = document.getElementById(`combo-search-${id}`);
    if (si) { si.value = ''; si.focus(); }
    // 選択肢を全再描画
    const chars = _comboState[id] ? _comboState[id].chars : [];
    const sel = document.getElementById(id) ? document.getElementById(id).value : '';
    const list = document.getElementById(`combo-list-${id}`);
    if (list) list.innerHTML = renderComboOptions(id, chars, sel, '');
    // selectedにスクロール
    setTimeout(() => {
      const selEl = list && list.querySelector('.combo-option.selected');
      if (selEl) selEl.scrollIntoView({ block: 'nearest' });
    }, 30);
  }
  // クリック外で閉じる
  setTimeout(() => {
    document.addEventListener('click', function closeCombo(e) {
      const wrap = document.getElementById(`combo-wrap-${id}`);
      if (wrap && !wrap.contains(e.target)) {
        const ddEl = document.getElementById(`combo-dropdown-${id}`);
        if (ddEl) ddEl.classList.remove('open');
      }
      document.removeEventListener('click', closeCombo);
    });
  }, 0);
}

function filterCombo(id, q) { q=romaToHira(q||'');
  const chars = _comboState[id] ? _comboState[id].chars : [];
  const sel = document.getElementById(id) ? document.getElementById(id).value : '';
  const list = document.getElementById(`combo-list-${id}`);
  if (list) list.innerHTML = renderComboOptions(id, chars, sel, q);
}

function selectComboOption(id, value, label) {
  const hidden = document.getElementById(id);
  if (hidden) hidden.value = value;
  const display = document.getElementById(`combo-display-${id}`);
  if (display) display.textContent = value ? label : '（なし）';
  const dd = document.getElementById(`combo-dropdown-${id}`);
  if (dd) dd.classList.remove('open');
  // リスト再描画でselectedを更新
  const chars = _comboState[id] ? _comboState[id].chars : [];
  const list = document.getElementById(`combo-list-${id}`);
  if (list) list.innerHTML = renderComboOptions(id, chars, value, '');
}

function initCombo(id, chars, selected) {
  _comboState[id] = { chars };
  const display = document.getElementById(`combo-display-${id}`);
  if (display) display.textContent = selected || '（なし）';
  const hidden = document.getElementById(id);
  if (hidden) hidden.value = selected || '';
}

function openPairEditModal(rowId,type){
  const row=S.reinf.find(r=>r.id===rowId);if(!row)return;
  const mainKey=type==='normal'?'normalMain':'castleMain';

  const otherMainKey=type==='normal'?'castleMain':'normalMain';
  const otherSubKey=type==='normal'?'castleSub':'normalSub';

  const otherLabel=type==='normal'?'城':'通常';
  const curMain=row[mainKey]||'';const curSub=row[subKey]||'';

    ?`<button class="btn" onclick="syncPairFromOther(${rowId},'${type}')">← ${otherLabel}から同期</button>`

function syncPairFromOther(rowId,type){

function openReinfSearch(rowId){

  const prevSortMode=RS.sortMode||'rar';
  RS={rowId,mainRar:[],mainRank:[],subRar:[],subRank:[],castleMainRar:[],castleMainRank:[],castleSubRar:[],castleSubRank:[],roleFilter:[_activeReinfTable==='ransaki'?'乱咲':'蕾'],sortMode:prevSortMode,dualMode:false};
  // ソートボタン表示を同期
  const onStyle='background:#EDE5D8;color:#634B38;border-color:#B4A494';
  const rarBtn=document.getElementById('rs-sort-rar');const rankBtn=document.getElementById('rs-sort-rank');
  if(rarBtn){rarBtn.className='f-btn'+(prevSortMode==='rar'?' on':'');rarBtn.style.cssText='white-space:nowrap';}
  if(rankBtn){rankBtn.className='f-btn'+(prevSortMode==='rank'?' on':'');rankBtn.style.cssText='white-space:nowrap';}
  const dualMode=!!(row.normalMain&&row.castleMain&&(row.normalMain!==row.castleMain||row.normalSub!==row.castleSub));

  const normalPanel=document.querySelector('.reinf-search-filters');

    document.getElementById('rs-sub-label').textContent=(row.normalSub||'副将')+' 【通常 副将】';
    // 城パネル設定
    document.getElementById('rs-castle-main-label').textContent=(row.castleMain||'大将')+' 【城】';
    document.getElementById('rs-castle-sub-label').textContent=(row.castleSub||'副将')+' 【城 副将】';
    document.getElementById('rs-castle-sub-section').style.display=row.castleSub?'block':'none';
    const castleMainCd=S.chars.find(c=>c.name===row.castleMain);
    const castleSubCd=S.chars.find(c=>c.name===row.castleSub);
    renderRSFilterBtns('rs-castle-main-rar',castleMainCd?castleMainCd.rars:ALL_RARITIES,RS.castleMainRar,'castle-main-rar');
    renderRSFilterBtns('rs-castle-main-rank',castleMainCd?castleMainCd.ranks:ALL_RANKS,RS.castleMainRank,'castle-main-rank');
    if(row.castleSub){
      renderRSFilterBtns('rs-castle-sub-rar',castleSubCd?castleSubCd.rars:ALL_RARITIES,RS.castleSubRar,'castle-sub-rar');
      renderRSFilterBtns('rs-castle-sub-rank',castleSubCd?castleSubCd.ranks:ALL_RANKS,RS.castleSubRank,'castle-sub-rank');
    }
    castlePanel.style.display='block';
  } else {
    document.getElementById('rs-main-label').textContent=(row.normalMain||'大将')+' のフィルター';
    document.getElementById('rs-sub-label').textContent=(row.normalSub||'副将')+' のフィルター';
    castlePanel.style.display='none';
  }
  document.getElementById('reinf-search-title').textContent='メンバー検索';
  const subSec=document.getElementById('rs-sub-section');
  subSec.style.display=row.normalSub?'block':'none';
  const mainCd=S.chars.find(c=>c.name===row.normalMain);
  const subCd=S.chars.find(c=>c.name===row.normalSub);
  renderRSFilterBtns('rs-main-rar',mainCd?mainCd.rars:ALL_RARITIES,RS.mainRar,'main-rar');
  renderRSFilterBtns('rs-main-rank',mainCd?mainCd.ranks:ALL_RANKS,RS.mainRank,'main-rank');
  if(row.normalSub){
    renderRSFilterBtns('rs-sub-rar',subCd?subCd.rars:ALL_RARITIES,RS.subRar,'sub-rar');
    renderRSFilterBtns('rs-sub-rank',subCd?subCd.ranks:ALL_RANKS,RS.subRank,'sub-rank');
  }
  document.getElementById('reinf-search-overlay').style.display='flex';
  renderRSResults();
}

function renderRSFilterBtns(elId,options,selArr,key){
  const isRar=key.endsWith('rar');
  document.getElementById(elId).innerHTML=options.map(r=>{const on=selArr.includes(r);const s=isRar?(RAR_S[r]||{}):null;const top=!isRar&&TOP_RANKS.includes(r);
    let style='';if(on){style=isRar&&s?`background:${s.bg};color:${s.c};border-color:${s.bd}`:top?'background:#EEEDFE;color:#3C3489;border-color:#AFA9EC':'background:#EDE5D8;color:#634B38;border-color:#B4A494';}
    return`<button class="f-btn${on?' on':''}" onclick="toggleRSFilter('${key}','${esc(r)}')">${r}</button>`;}).join('');
}

function toggleRSFilter(key,val){
  let arr;
  if(key==='main-rar')arr=RS.mainRar;
  else if(key==='main-rank')arr=RS.mainRank;
  else if(key==='sub-rar')arr=RS.subRar;
  else if(key==='sub-rank')arr=RS.subRank;
  else if(key==='castle-main-rar')arr=RS.castleMainRar;
  else if(key==='castle-main-rank')arr=RS.castleMainRank;
  else if(key==='castle-sub-rar')arr=RS.castleSubRar;
  else arr=RS.castleSubRank;
  const i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);
  const row=S.reinf.find(r=>r.id===RS.rowId);if(!row)return;
  const mainCd=S.chars.find(c=>c.name===row.normalMain);
  const subCd=S.chars.find(c=>c.name===row.normalSub);
  renderRSFilterBtns('rs-main-rar',mainCd?mainCd.rars:ALL_RARITIES,RS.mainRar,'main-rar');
  renderRSFilterBtns('rs-main-rank',mainCd?mainCd.ranks:ALL_RANKS,RS.mainRank,'main-rank');
  if(row.normalSub){
    renderRSFilterBtns('rs-sub-rar',subCd?subCd.rars:ALL_RARITIES,RS.subRar,'sub-rar');
    renderRSFilterBtns('rs-sub-rank',subCd?subCd.ranks:ALL_RANKS,RS.subRank,'sub-rank');
  }
  if(RS.dualMode){
    const castleMainCd=S.chars.find(c=>c.name===row.castleMain);
    const castleSubCd=S.chars.find(c=>c.name===row.castleSub);
    renderRSFilterBtns('rs-castle-main-rar',castleMainCd?castleMainCd.rars:ALL_RARITIES,RS.castleMainRar,'castle-main-rar');
    renderRSFilterBtns('rs-castle-main-rank',castleMainCd?castleMainCd.ranks:ALL_RANKS,RS.castleMainRank,'castle-main-rank');
    if(row.castleSub){
      renderRSFilterBtns('rs-castle-sub-rar',castleSubCd?castleSubCd.rars:ALL_RARITIES,RS.castleSubRar,'castle-sub-rar');
      renderRSFilterBtns('rs-castle-sub-rank',castleSubCd?castleSubCd.ranks:ALL_RANKS,RS.castleSubRank,'castle-sub-rank');
    }
  }
  renderRSResults();
}

function memberPassesRS(m,row){
  const mainName=row.normalMain;const subName=row.normalSub;
  if(mainName){
    const mc=m.chars.find(c=>c.name===mainName);if(!mc)return false;
    if(!rarMatchesFilter(mc.rar, RS.mainRar))return false;
    if(RS.mainRank.length&&!RS.mainRank.every(fr=>mc.ranks&&mc.ranks.includes(fr)))return false;
  }
  if(subName){
    const sc=m.chars.find(c=>c.name===subName);if(!sc)return false;
    if(!rarMatchesFilter(sc.rar, RS.subRar))return false;
    if(RS.subRank.length&&!RS.subRank.every(fr=>sc.ranks&&sc.ranks.includes(fr)))return false;
  }
  if(RS.dualMode){
    const castleMainName=row.castleMain;const castleSubName=row.castleSub;
    if(castleMainName){
      const mc=m.chars.find(c=>c.name===castleMainName);if(!mc)return false;
      if(!rarMatchesFilter(mc.rar, RS.castleMainRar))return false;
      if(RS.castleMainRank.length&&!RS.castleMainRank.every(fr=>mc.ranks&&mc.ranks.includes(fr)))return false;
    }
    if(castleSubName){
      const sc=m.chars.find(c=>c.name===castleSubName);if(!sc)return false;
      if(!rarMatchesFilter(sc.rar, RS.castleSubRar))return false;
      if(RS.castleSubRank.length&&!RS.castleSubRank.every(fr=>sc.ranks&&sc.ranks.includes(fr)))return false;
    }
  }
  if(RS.roleFilter.length&&!RS.roleFilter.includes(m.role))return false;
  return true;
}

const RS_RAR_SCORE={'LG3':8,'LG2':7,'LG1':6,'LG':5,'UR':4,'SR':3,'R':2,'N':1};
// 裏6〜裏1・表6〜表1の基礎点（技極加算のベース用）
const RS_RANK_BASE={'裏6':12,'裏5':11,'裏4':10,'裏3':9,'裏2':8,'裏1':7,'表6':6,'表5':5,'表4':4,'表3':3,'表2':2,'表1':1};

// ランクスコア計算（技極加算・裏技極26・全技極27）
function rsRankScore(ranks){
  if(!ranks||!ranks.length) return 0;
  if(ranks.includes('全技極')) return 27;
  if(ranks.includes('裏技極')) return 26;
  if(ranks.includes('技極')){
    // 技極(13) + 持っている裏ランクの最高値
    const URA=['裏6','裏5','裏4','裏3','裏2','裏1'];
    const topUra=URA.find(r=>ranks.includes(r));
    return 13+(topUra?RS_RANK_BASE[topUra]:0);
  }
  // 通常ランク：最高点
  return Math.max(...ranks.map(r=>RS_RANK_BASE[r]||0));
}

// キャラ単体のレアリティ・ランクスコアを返す
function rsCharScores(member, charName){
  if(!charName) return {rar:0,rank:0};
  const c=member.chars.find(x=>x.name===charName);
  if(!c) return {rar:0,rank:0};
  return {rar:RS_RAR_SCORE[c.rar]||0, rank:rsRankScore(c.ranks)};
}

// ソートキー配列を生成：[大将rar, 大将rank, 副将rar, 副将rank, 宿縁] × 通常(+城dualMode)
function rsSortKeys(m, row, mainCd, castleMainCd){
  const nm=rsCharScores(m,row.normalMain);
  const ns=rsCharScores(m,row.normalSub);
  const cm=RS.dualMode?rsCharScores(m,row.castleMain):{rar:0,rank:0};
  const cs=RS.dualMode?rsCharScores(m,row.castleSub):{rar:0,rank:0};
  const sh=shukuenPt(m,mainCd)+(RS.dualMode?shukuenPt(m,castleMainCd):0);
  if(RS.sortMode==='rar'){
    // レア優先: 大将rar > 大将rank > 副将rar > 副将rank > 宿縁
    return [nm.rar+cm.rar, nm.rank+cm.rank, ns.rar+cs.rar, ns.rank+cs.rank, sh];
  } else {
    // ランク優先: 大将rank > 大将rar > 副将rank > 副将rar > 宿縁
    return [nm.rank+cm.rank, nm.rar+cm.rar, ns.rank+cs.rank, ns.rar+cs.rar, sh];
  }
}

// 変更後
async function setReinfMember(rowId,name){
  const row=S.reinf.find(r=>r.id===rowId);if(!row)return;

  // 同じtableType内で既に同名の行があればローカルもnullにする
  if(name){
    S.reinf.forEach(r=>{
      if(r.id!==rowId && r.memberName===name && (r.tableType||'ransaki')===(row.tableType||'ransaki')){
        r.memberName=null;
      }
    });
  }

  row.memberName=name||null;
  try {
    await fetch(`/api/reinf?id=${rowId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        memberName: row.memberName,
        normalMain: row.normalMain,
        normalSub: row.normalSub,
        castleMain: row.castleMain,
        castleSub: row.castleSub,
        tableType: row.tableType||'ransaki',
      })
    });
  } catch(err) {
    console.error(err);
  }
  renderReinfTable();
  if(name)toast(name+'を追加しました');else toast('解除しました');
  renderRSResults();
}

function shukuenLevel(memberChar, charDef){
  if(!memberChar || !memberChar.ranks || !memberChar.ranks.length) return null;

  const ranks = memberChar.ranks;
  const hasUR = charDef?.rars?.includes('UR');

  // ① 紫（技極以上）
  if(ranks.includes('裏技極') || ranks.includes('技極')){
    return 'gikkyoku';
  }

  // ② 緑（最大）
  if(hasUR){
    // URあり → 表6以上
    if(ranks.includes('表6')){
      return 'omote6';
    }
  }else{
    // URなし → 表5以上
    if(
      ranks.includes('表5')){
      return 'omote6';
    }
  }

  // ③ 黄（所持のみ）
  return 'soji';
}

function shukuenBadgeHtml(member, charDef){
  const shukuens=charDef.shukuens||[];
  const slots=shukuens.length?shukuens:[charDef.shukuen||{enabled:false,members:[]}];
  const enabledSlots=slots.filter(x=>x&&x.enabled);
  const badges=[];
  slots.forEach((sh,si)=>{
    if(!sh||!sh.enabled||!sh.members) return;
    let g=0,o=0,s=0;
    sh.members.forEach(sName=>{
      if(sName==='?') return;
      const mc=member.chars.find(c=>c.name===sName);
      const lv=shukuenLevel(mc, S.chars.find(x=>x.name===sName));
      if(lv==='gikkyoku') g++;
      else if(lv==='omote6') o++;
      else if(lv==='soji') s++;
    });
    const total=sh.members.filter(n=>n!=='?').length;
    const label=enabledSlots.length>1
      ?`<span style="font-size:10px;color:var(--t2)">宿縁${si+1}</span>`
      :`<span style="font-size:10px;color:var(--t2)">宿縁</span>`;
    let pills='';
    pills+=`<span class="sh-pill gikkyoku"><span class="sh-pill-dot"></span>${g}</span>`;
    pills+=`<span class="sh-pill omote6"><span class="sh-pill-dot"></span>${o}</span>`;
    pills+=`<span class="sh-pill soji"><span class="sh-pill-dot"></span>${s}</span>`;
    badges.push(`<div class="sh-badge-wrap">${label}${pills}<span style="font-size:10px;color:var(--t3)">/${total}</span></div>`);
  });
  if(!badges.length) return '';
  return badges.length>1
    ?`<div style="display:flex;flex-direction:column;gap:2px">${badges.join('')}</div>`
    :badges[0];
}

function shukuenPt(member, charDef){
  if(!charDef) return 0;
  const shukuens=charDef.shukuens||[];
  const slots=shukuens.length?shukuens:[charDef.shukuen||{enabled:false,members:[]}];
  let total=0;
  slots.forEach(sh=>{
    if(!sh||!sh.enabled||!sh.members) return;
    sh.members.forEach(sName=>{
      if(sName==='?') return;
      const mc=member.chars.find(c=>c.name===sName);
      const lv=shukuenLevel(mc, S.chars.find(x=>x.name===sName));
      if(lv==='gikkyoku') total+=3;
      else if(lv==='omote6') total+=2;
      else if(lv==='soji') total+=1;
    });
  });
  return total;
}

  // ピンチ
  pinching: false,
  pinchDist0: 0,
  pinchScale0: 1,
};

function openCropModal(prefix, dataUrl) {
  const modal = document.getElementById('img-crop-modal');
  const stage = document.getElementById('crop-stage');
  const imgEl = document.getElementById('crop-img');
  const zoom  = document.getElementById('crop-zoom');

  modal.classList.remove('hidden');

  const initCrop = () => {
  requestAnimationFrame(() => {
  const sw = stage.clientWidth;
  const sh = stage.clientHeight || sw;
    const hole = Math.round(sw * 0.78); // 正方形サイズ（ステージの78%）

    const cs = _cropState;
    cs.prefix = prefix;
    cs.imgEl = imgEl;
    cs.stageW = sw; cs.stageH = sh;
    cs.holeSize = hole;
    cs.naturalW = imgEl.naturalWidth;
    cs.naturalH = imgEl.naturalHeight;
    cs.ox = 0; cs.oy = 0;

    // 初期スケール：短辺がholeにぴったり収まるよう
    const fitScale = hole / Math.min(cs.naturalW, cs.naturalH);
    cs.scale = fitScale;
    zoom.min = fitScale;
    zoom.max = fitScale * 7;
    zoom.step = fitScale * 0.01;
    zoom.value = fitScale;

    // SVGのホール位置を設定
    updateCropHole(sw, sh, hole);
    applyTransform();
    updateCropPreview();
  });
  };

  // 画像のデコード完了を待ってから初期化する（iPhoneの大きい写真で
  // デコードが遅れ naturalWidth が 0 のまま処理が進み、真っ黒な
  // 画像が書き出される不具合への対策）
  imgEl.onload = initCrop;
  imgEl.src = dataUrl;
  if (imgEl.complete && imgEl.naturalWidth > 0) {
    // すでにキャッシュ等で読み込み済みの場合は即実行
    initCrop();
  }

  zoom.oninput = () => {
    setCropScale(parseFloat(zoom.value));
    clampOffset();
    applyTransform();
    updateCropPreview();
  };

  // ── マウスドラッグ ──
  stage.onmousedown = e => {
    _cropState.dragging = true;
    _cropState.lastX = e.clientX;
    _cropState.lastY = e.clientY;
    e.preventDefault();
  };
  window.onmousemove = e => {
    if(!_cropState.dragging) return;
    _cropState.ox += e.clientX - _cropState.lastX;
    _cropState.oy += e.clientY - _cropState.lastY;
    _cropState.lastX = e.clientX;
    _cropState.lastY = e.clientY;
    clampOffset();
    applyTransform();
    updateCropPreview();
  };
  window.onmouseup = () => { _cropState.dragging = false; };

  // ── マウスホイールズーム ──
  stage.onwheel = e => {
    e.preventDefault();
    const zoom = document.getElementById('crop-zoom');
    const delta = e.deltaY > 0 ? -0.05 : 0.05;
    const newScale = Math.min(Math.max(
      _cropState.scale + delta * _cropState.scale,
      parseFloat(zoom.min)
    ), parseFloat(zoom.max));
    setCropScale(newScale);
    zoom.value = _cropState.scale;
    clampOffset();
    applyTransform();
    updateCropPreview();
  };

  // ── タッチ（1本：ドラッグ / 2本：ピンチ） ──
  stage.ontouchstart = e => {
    if(e.touches.length === 2){
      _cropState.pinching = true;
      _cropState.pinchDist0 = pinchDist(e.touches);
      _cropState.pinchScale0 = _cropState.scale;
    } else {
      _cropState.dragging = true;
      _cropState.lastX = e.touches[0].clientX;
      _cropState.lastY = e.touches[0].clientY;
    }
    e.preventDefault();
  };
  stage.ontouchmove = e => {
    if(_cropState.pinching && e.touches.length === 2){
      const ratio = pinchDist(e.touches) / _cropState.pinchDist0;
      const zoom = document.getElementById('crop-zoom');
      const newScale = Math.min(Math.max(_cropState.pinchScale0 * ratio, parseFloat(zoom.min)), parseFloat(zoom.max));
      setCropScale(newScale);
      zoom.value = _cropState.scale;
      clampOffset();
      applyTransform();
      updateCropPreview();
    } else if(_cropState.dragging && e.touches.length === 1){
      _cropState.ox += e.touches[0].clientX - _cropState.lastX;
      _cropState.oy += e.touches[0].clientY - _cropState.lastY;
      _cropState.lastX = e.touches[0].clientX;
      _cropState.lastY = e.touches[0].clientY;
      clampOffset();
      applyTransform();
      updateCropPreview();
    }
    e.preventDefault();
  };
  stage.ontouchend = e => {
    if(e.touches.length < 2) _cropState.pinching = false;
    if(e.touches.length === 0) _cropState.dragging = false;
  };
}

function pinchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function updateCropHole(sw, sh, hole){
  const svg = document.getElementById('crop-svg');
  svg.setAttribute('width', sw);
  svg.setAttribute('height', sh);
  svg.setAttribute('viewBox', `0 0 ${sw} ${sh}`);
  const x = (sw - hole) / 2;
  const y = (sh - hole) / 2;
  ['crop-hole','crop-border'].forEach(id => {
    const el = document.getElementById(id);
    el.setAttribute('x', x);
    el.setAttribute('y', y);
    el.setAttribute('width', hole);
    el.setAttribute('height', hole);
  });
}

// プレビュー枠（ホール）の中心を軸にスケールを変更する
function setCropScale(newScale){
  const cs = _cropState;
  const ratio = newScale / cs.scale;
  cs.ox *= ratio;
  cs.oy *= ratio;
  cs.scale = newScale;
}

function applyTransform(){
  const cs = _cropState;
  const cx = cs.stageW / 2 + cs.ox;
  const cy = cs.stageH / 2 + cs.oy;
  cs.imgEl.style.left = '0px';
  cs.imgEl.style.top  = '0px';
  cs.imgEl.style.width  = cs.naturalW * cs.scale + 'px';
  cs.imgEl.style.height = cs.naturalH * cs.scale + 'px';
  cs.imgEl.style.transform = `translate(${cx - cs.naturalW*cs.scale/2}px, ${cy - cs.naturalH*cs.scale/2}px)`;
}

function clampOffset(){
  const cs = _cropState;
  const hw = cs.naturalW * cs.scale / 2;
  const hh = cs.naturalH * cs.scale / 2;
  const hs = cs.holeSize / 2;
  // 正方形の端が画像の端より外に出ないよう制限
  const maxOx = hw - hs;
  const maxOy = hh - hs;
  cs.ox = Math.max(-maxOx, Math.min(maxOx, cs.ox));
  cs.oy = Math.max(-maxOy, Math.min(maxOy, cs.oy));
}

function updateCropPreview(){
  const cs = _cropState;
  const canvas = document.getElementById('crop-preview-canvas');
  const ctx = canvas.getContext('2d');
  const size = 80;
  canvas.width = canvas.height = size;

  // 正方形の左上（ステージ座標）
  const hx = (cs.stageW - cs.holeSize) / 2;
  const hy = (cs.stageH - cs.holeSize) / 2;
  // 画像の左上（ステージ座標）
  const imgLeft = cs.stageW/2 + cs.ox - cs.naturalW*cs.scale/2;
  const imgTop  = cs.stageH/2 + cs.oy - cs.naturalH*cs.scale/2;
  // 正方形内の画像座標（元画像ピクセル）
  const srcX = (hx - imgLeft) / cs.scale;
  const srcY = (hy - imgTop)  / cs.scale;
  const srcS = cs.holeSize / cs.scale;

  ctx.drawImage(cs.imgEl, srcX, srcY, srcS, srcS, 0, 0, size, size);
}

function closeCropModal(){
  document.getElementById('img-crop-modal').classList.add('hidden');
  // ファイル入力をリセット（同じファイルを再選択できるよう）
  const prefix = _cropState.prefix;
  if(prefix){
    const inp = document.getElementById(`${prefix}-img-input`);
    if(inp) inp.value = '';
  }
}

async function confirmCrop(){
  const cs = _cropState;
  if (!cs.naturalW || !cs.naturalH) {
    toast('画像の読み込みが完了していません。もう一度お試しください');
    return;
  }
  const size = 400;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  const hx = (cs.stageW - cs.holeSize) / 2;
  const hy = (cs.stageH - cs.holeSize) / 2;
  const imgLeft = cs.stageW/2 + cs.ox - cs.naturalW*cs.scale/2;
  const imgTop  = cs.stageH/2 + cs.oy - cs.naturalH*cs.scale/2;
  const srcX = (hx - imgLeft) / cs.scale;
  const srcY = (hy - imgTop)  / cs.scale;
  const srcS = cs.holeSize / cs.scale;

  ctx.drawImage(cs.imgEl, srcX, srcY, srcS, srcS, 0, 0, size, size);

  canvas.toBlob(async blob => {
    document.getElementById('img-crop-modal').classList.add('hidden');
    const prefix = cs.prefix;
    const previewUrl = URL.createObjectURL(blob);
    renderImgPreview(prefix, previewUrl, true);
    try {
      const url = await uploadCharImage(blob);
      if(prefix==='cn') _cnImg = url;
      else              _cuImg = url;
      renderImgPreview(prefix, url, false);
    } catch(e) {
      toast('画像のアップロードに失敗しました');
      resetImgArea(prefix);
    }
  }, 'image/jpeg', 0.82);
}

function handleImgSelect(prefix, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => openCropModal(prefix, e.target.result);
  reader.readAsDataURL(file);
}

async function uploadCharImage(blob){
  const fd = new FormData();
  fd.append('file', blob, 'char.jpg');
  const res = await fetch('/api/chars/upload-image', { method:'POST', body:fd });
  if(!res.ok) throw new Error('upload failed');
  const data = await res.json();
  return data.url;
}

function renderImgPreview(prefix, url, uploading=false){
  const area = document.getElementById(`${prefix}-img-area`);
  if(!area) return;
  area.innerHTML = `<div style="display:flex;align-items:flex-start;gap:10px">
    <div class="img-preview-wrap">
      <img class="img-preview" src="${url}" alt="" style="${uploading?'opacity:.5':''}">
      ${uploading?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t2)">送信中...</div>`
        :`<button class="img-remove-btn" onclick="removeImg('${prefix}')" title="削除">✕</button>`}
    </div>
    ${!uploading?`<label class="img-upload-area" style="display:inline-block;padding:6px 14px;font-size:11px;color:var(--t2);cursor:pointer;margin-top:0">
      <input type="file" id="${prefix}-img-input" accept="image/*" onchange="handleImgSelect('${prefix}',this)" style="display:none">
      画像を変更
    </label>`:''}
  </div>`;
}

function removeImg(prefix){
  if(prefix==='cn'){ _cnImg = null; resetImgArea('cn'); }
  else             { _cuImg = '';   resetImgArea('cu'); }
}

function resetImgArea(prefix){
  const area = document.getElementById(`${prefix}-img-area`);
  if(!area) return;
  area.innerHTML = `<div class="img-upload-area">
    <input type="file" id="${prefix}-img-input" accept="image/*" onchange="handleImgSelect('${prefix}',this)">
    <div style="font-size:12px;color:var(--t2)">タップして画像を選択</div>
    <div style="font-size:10px;color:var(--t3);margin-top:2px">トリミングして保存されます</div>
  </div>`;
}

async function addChar(){
  const name=document.getElementById('cn-name').value;
  const yomi=document.getElementById('cn-yomi').value.trim();
  const sortedRars=ALL_RARITIES.filter(r=>cnSelRar.includes(r));
  const sortedRanks=ALL_RANKS.filter(r=>cnSelRank.includes(r));
  showLoading();
  try {
    const res = await fetch('/api/chars',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name,
        yomi,
        rars:sortedRars,
        ranks:sortedRanks,
        shukuens:cnShukuens,
        exSotsui:cnExSotsui,
        img: _cnImg || null
      })
    });
    if(!res.ok){
      // 失敗時は入力内容を保持したまま、エラーのみ通知
      toast('追加に失敗しました');
      return;
    }
    await load();
    toast('追加しました');
    initCharNewForm();
    // 宿縁に？が残っているキャラのうち、新キャラが該当するかもしれないものを提示
    const candidates = S.chars.filter(cd => {
      if(cd.name === name) return false;
      const slots = cd.shukuens && cd.shukuens.length ? cd.shukuens : [cd.shukuen||{enabled:false,members:[]}];
      return slots.some(sh => sh && sh.enabled && sh.members && sh.members.includes('?'));
    });
    if(candidates.length){
      openModal('shukuen-hint',`<h3>宿縁の？候補</h3>
        <p style="font-size:13px;color:var(--t2);margin:0 0 10px">「${esc(name)}」が宿縁キャラに含まれる可能性があるキャラ（宿縁に未確定の？があるもの）：</p>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto">
          ${candidates.map(cd=>{
            const slots=cd.shukuens&&cd.shukuens.length?cd.shukuens:[cd.shukuen||{enabled:false,members:[]}];
            const slotInfo=slots.map((sh,i)=>{
              if(!sh||!sh.enabled)return null;
              const qCount=(sh.members||[]).filter(m=>m==='?').length;
              if(!qCount)return null;
              return `宿縁${i+1}（？×${qCount}）`;
            }).filter(Boolean).join('、');
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;gap:8px">
              <div>
                <div style="font-size:13px;font-weight:500">${esc(cd.name)}</div>
                <div style="font-size:11px;color:var(--t3);margin-top:2px">${slotInfo}</div>
              </div>
              <button class="btn" style="font-size:11px;padding:4px 10px;white-space:nowrap" onclick="closeModal();jumpToCharUpdate('${esc(cd.name)}')">確認する</button>
            </div>`;
          }).join('')}
        </div>
        <div class="modal-acts"><button class="btn pri" onclick="closeModal()">閉じる</button></div>`);
    }
  } catch(e){
    // 通信エラー時も入力内容を保持したまま、エラーのみ通知
    toast('追加に失敗しました');
  } finally {
    hideLoading();
  }
}

function sortByYomi(arr){ return [...arr].sort((a,b)=>(a.yomi||a.name).localeCompare(b.yomi||b.name,'ja')); }

function renderCharUpdateSel(){

}

function renderCuSelList(q){ q=romaToHira(q||'');

  const chars=sortByYomi(S.chars).filter(c=>!q||(c.name.includes(q)||(c.yomi||'').includes(q)));

document.addEventListener('click',function(e){

});

function loadCharForUpdate(){
  const name=document.getElementById('cu-sel').value;
  const cd=S.chars.find(c=>c.name===name);
  if(!cd){document.getElementById('cu-detail').style.display='none';return;}
  document.getElementById('cu-name').value=cd.name;
  document.getElementById('cu-yomi').value=cd.yomi||'';
  cuSelRar=[...cd.rars];cuSelRank=[...cd.ranks];
  _cuImg = null;
  if(cd.img){ renderImgPreview('cu', cd.img); }
  else       { resetImgArea('cu'); }
  renderCharMgmtRarBtns('cu-rar-btns',cuSelRar,'toggleCuRar');
  renderCharMgmtRankBtns('cu-rank-btns',cuSelRank,'toggleCuRank');
  const raw=cd.shukuens||[];
  cuShukuens=[0,1].map(i=>{
    const s=raw[i]||cd.shukuen||{enabled:false,members:[]};
    return {enabled:!!s.enabled, members:[...(s.members||[])]};
  });
  if(!raw.length&&cd.shukuen){cuShukuens[1]={enabled:false,members:[]};}
  setCuShukuen(0,cuShukuens[0].enabled);setCuShukuen(1,cuShukuens[1].enabled);
  setCuEx(!!cd.exSotsui);
  // 入力補助ボタンの表示を同期
  const btn = document.getElementById('char-assist-toggle-btn-cu');
  if(btn){
    btn.textContent = '入力補助 ' + (_charAssistMode ? 'ON' : 'OFF');
    btn.style.background = _charAssistMode ? 'var(--acc)' : 'var(--bg)';
    btn.style.color = _charAssistMode ? '#FFF8F0' : 'var(--t2)';
    btn.style.borderColor = _charAssistMode ? 'var(--acc)' : 'var(--bm)';
  }
  document.getElementById('cu-detail').style.display='block';
}

  const yomi=document.getElementById('cu-yomi').value.trim();
  const sortedRars=ALL_RARITIES.filter(r=>cuSelRar.includes(r));

  showLoading();
  try {
    const body = {
      name, yomi,
      rars:sortedRars,

async function deleteChar(){
  const name = document.getElementById('cu-sel').value;
  if(!name){ toast('キャラを選択してください'); return; }
  if(!confirm(`${name} を削除しますか？`)) return;
  try{
    const res = await fetch(`/api/chars/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if(!res.ok){ throw new Error('削除失敗'); }
    await load();
    document.getElementById('cu-detail').style.display = 'none';
    toast('削除しました');
  } catch(err){
    console.error(err);

}

let _meSelId = null; // 選択中のmember id

function _renderMeSelList(q) {
  const list = document.getElementById('me-sel-list');
  if (!list) return;
  const sorted = [...S.members].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const filtered = q
    ? sorted.filter(m => m.name.toLowerCase().includes(q.toLowerCase()) || String(m.id).includes(q))
    : sorted;
  if (!filtered.length) {
    list.innerHTML = '<div class="combo-option combo-empty">該当なし</div>';
    return;
  }
  list.innerHTML = filtered.map(m =>
    `<div class="combo-option${_meSelId === m.id ? ' selected' : ''}" onclick="selectMeSel(${m.id},'${m.name.replace(/'/g,"\\'")}')">
      ${m.name}<span style="font-size:11px;color:var(--t3);margin-left:6px">ID:${m.id}</span>${m.status==='無効'?'<span style="font-size:10px;color:var(--danger);margin-left:6px">無効</span>':''}
    </div>`
  ).join('');
}

function toggleMeSelCombo() {
  const dd = document.getElementById('me-sel-dropdown');
  if (!dd) return;
  const isOpen = dd.classList.contains('open');
  dd.classList.toggle('open', !isOpen);
  if (!isOpen) {
    const s = document.getElementById('me-sel-search');
    if (s) { s.value = ''; s.focus(); }
    _renderMeSelList('');

}

async function commitMemberEdit(pending){
  const {id,name,role,status,memberRole,password} = pending || _pendingMemberEdit;
  _pendingMemberEdit = null;
  showLoading();
  try {
    const res = await fetch(`/api/members/${id}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,role,status,memberRole,password:password||undefined})
    });
    if(!res.ok){ throw new Error('保存失敗'); }
    const data = await res.json();
    // 自分自身のパスワードを変更した場合はセッションが無効になるため再ログインへ
    if(password && id === currentMemberId){
      closeModal();
      toast('パスワードを変更しました。再度ログインしてください');
      doLogout();
      return;
    }

    await load();
    closeModal();
    const roleLabel = {user:'利用者','reinf-admin':'援軍管理者',admin:'管理者'}[data.memberRole] || data.memberRole;
    openModal('member-updated',`<h3>メンバーを更新しました</h3>
      <div class="field"><label>ID</label><div class="added-val">${data.id}</div></div>
      ${data.updatedPassword ? `<div class="field"><label>パスワード</label><div class="added-val">${data.updatedPassword}</div></div>` : ''}
      <div class="field"><label>名前</label><div class="added-val">${data.name}</div></div>
      <div class="field"><label>所属</label><div class="added-val">${data.role || '―'}</div></div>
      <div class="field"><label>状態</label><div class="added-val">${data.status || '有効'}</div></div>
      <div class="field"><label>権限</label><div class="added-val">${roleLabel}</div></div>
      <div class="modal-acts"><button class="btn pri" onclick="closeModal()">閉じる</button></div>`);
  } catch(err){
    console.error(err);
    toast('エラーが発生しました');
  } finally {
    hideLoading();
  }
}
