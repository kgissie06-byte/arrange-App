/* ========== ④ アンケート ========== */
// API: /api/surveys (GET/POST), /api/surveys?id=XX (GET/POST/DELETE)
//      /api/surveys?action=vote (POST), /api/surveys?action=voters&id=XX (GET)

let _surveys = [];           // キャッシュ
let _activeSurveyId = null;  // 詳細表示中のアンケートID
let _pendingVotes = new Set(); // 仮選択中のペアID（確定前）
let _confirmedVotes = new Set(); // 確定済みペアID（サーバーと同期済み）

function getSvMember(){
  if(!currentMemberId) return null;
  const m = S.members.find(x => x.id === currentMemberId);
  return m ? { id: m.id, name: m.name } : null;
}

/* ---------- ユーティリティ ---------- */
function formatDateTime(iso){
  if(!iso) return '未設定';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function pairName(p){ return `${p.main||'（なし）'} - ${p.sub||'（なし）'}`; }

/* ---------- アンケート一覧 ---------- */
async function initSurveyPage(){
  if(_activeSurveyId){
    await fetchAndRenderDetail(_activeSurveyId);
  } else {
    await fetchAndRenderList();
  }
}

async function fetchAndRenderList(){
  const el = document.getElementById('sv-list');
  el.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const member = getSvMember();
    const qs = member ? `?memberId=${member.id}` : '';
    const res = await fetch(`/api/surveys${qs}`);
    if(!res.ok) throw new Error();
    _surveys = await res.json();
  } catch(e){
    el.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
    return;
  }
  renderSurveyList();
}

function renderSurveyList(){
  const el = document.getElementById('sv-list');
  if(!_surveys.length){
    el.innerHTML = '<div class="empty">アンケートがありません<br><span style="font-size:11px">「＋ 新規作成」で作成してください</span></div>';
    return;
  }
  const now = Date.now();
  const sorted = [..._surveys].sort((a,b) => {
    const aOpen = new Date(a.deadline).getTime() > now;
    const bOpen = new Date(b.deadline).getTime() > now;
    if(aOpen !== bOpen) return aOpen ? -1 : 1;
    return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
  });
  el.innerHTML = sorted.map(sv => {
    const isOpen = new Date(sv.deadline).getTime() > now;
    const totalVotes = (sv.pairs||[]).reduce((s,p)=>s+(p.votes||0),0);
    const tableLabel = sv.tableType === 'ransaki' ? '乱咲' : '蕾';
    const myCount = (sv.myVotePairIds||[]).length;
    return `<div class="sv-card" onclick="openSurveyDetail(${sv.id})">
      <div class="sv-card-title">${sv.title}</div>
      <div class="sv-card-meta">
        <span class="sv-status ${isOpen?'open':'closed'}">${isOpen?'受付中':'終了'}</span>
        <span>【${tableLabel}】</span>
        <span>終了: ${formatDateTime(sv.deadline)}</span>
        <span>総票数: ${totalVotes}</span>
        ${myCount > 0 ? `<span style="color:#1D9E75;font-weight:500">✓ ${myCount}票投票済</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ---------- アンケート作成 ---------- */
function openCreateSurvey(){
  const now = new Date();
  now.setDate(now.getDate() + 7);
  const defaultDeadline = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  openModal('create-survey', `<h3>アンケート作成</h3>
    <div class="field"><label>タイトル</label><input type="text" id="sv-title-in" placeholder="例: 趙国編アンケート(乱咲)" style="font-size:16px"></div>
    <div class="field"><label>所属</label>
      <div style="display:flex;gap:6px;margin-top:4px">
        <button id="sv-tbl-ransaki" class="sub-tab active" onclick="setSvTable('ransaki')">乱咲</button>
        <button id="sv-tbl-tsubomi" class="sub-tab" onclick="setSvTable('tsubomi')">蕾</button>
      </div>
    </div>
    <div class="field"><label>終了日時</label><input type="datetime-local" id="sv-deadline-in" value="${defaultDeadline}" style="font-size:16px"></div>
    <div style="font-size:11px;color:var(--danger);min-height:14px" id="sv-create-err"></div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn pri" id="sv-create-btn" onclick="doCreateSurvey()">作成</button>
    </div>`);
  window._svCreateTable = 'ransaki';
}
function setSvTable(t){
  window._svCreateTable = t;
  document.getElementById('sv-tbl-ransaki').classList.toggle('active', t==='ransaki');
  document.getElementById('sv-tbl-tsubomi').classList.toggle('active', t==='tsubomi');
}
async function doCreateSurvey(){
  const title = (document.getElementById('sv-title-in').value||'').trim();
  const deadlineLocal = document.getElementById('sv-deadline-in').value;
  const tableType = window._svCreateTable || 'ransaki';
  const errEl = document.getElementById('sv-create-err');
  const btn = document.getElementById('sv-create-btn');
  if(!title){ errEl.textContent = 'タイトルを入力してください'; return; }
  if(!deadlineLocal){ errEl.textContent = '終了日時を設定してください'; return; }
  const deadline = new Date(deadlineLocal).toISOString();
  if(new Date(deadline).getTime() <= Date.now()){ errEl.textContent = '終了日時は未来の日時を設定してください'; return; }
  btn.disabled = true; btn.textContent = '作成中...';
  try {
    const res = await fetch('/api/surveys', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, tableType, deadline }),
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error||'作成に失敗しました'; btn.disabled=false; btn.textContent='作成'; return; }
    closeModal();
    toast('アンケートを作成しました');
    await fetchAndRenderList();
  } catch(e){
    errEl.textContent = 'エラーが発生しました'; btn.disabled=false; btn.textContent='作成';
  }
}

/* ---------- アンケート詳細 ---------- */
async function openSurveyDetail(svId){
  _activeSurveyId = svId;
  _pendingVotes = new Set();
  document.getElementById('sv-list-view').style.display = 'none';
  document.getElementById('sv-detail-view').style.display = 'block';
  document.getElementById('sv-detail-title').textContent = '読み込み中...';
  document.getElementById('sv-pairs-list').innerHTML = '<div class="empty">読み込み中...</div>';
  document.getElementById('sv-add-pair-area').style.display = 'none';
  document.getElementById('sv-vote-confirm-area').style.display = 'none';
  await fetchAndRenderDetail(svId);
}

async function fetchAndRenderDetail(svId){
  try {
    const member = getSvMember();
    const qs = member ? `&memberId=${member.id}` : '';
    const res = await fetch(`/api/surveys?id=${svId}${qs}`);
    if(!res.ok) throw new Error();
    const sv = await res.json();
    const idx = _surveys.findIndex(s => s.id === sv.id);
    if(idx >= 0) _surveys[idx] = sv; else _surveys.push(sv);
    // 確定済み票をサーバーから同期
    _confirmedVotes = new Set(sv.myVotePairIds || []);
    // ペンディングは確定済みで初期化
    _pendingVotes = new Set(_confirmedVotes);
    renderSurveyDetail(sv);
  } catch(e){
    console.error(e);
    document.getElementById('sv-pairs-list').innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}

function closeSurveyDetail(){
  _activeSurveyId = null;
  _pendingVotes = new Set();
  _confirmedVotes = new Set();
  document.getElementById('sv-list-view').style.display = 'block';
  document.getElementById('sv-detail-view').style.display = 'none';
  renderSurveyList();
}

function renderSurveyDetail(sv){
  if(!sv) return;
  const now = Date.now();
  const isOpen = new Date(sv.deadline).getTime() > now;
  const tableLabel = sv.tableType === 'ransaki' ? '乱咲' : '蕾';
  const member = getSvMember();
  const TABLE_ROLE = { ransaki: '乱咲', tsubomi: '蕾' };
  const memberObj = S.members.find(x => x.id === currentMemberId);
  const canInteract = isOpen && (memberObj?.role ?? '') === (TABLE_ROLE[sv.tableType] ?? '');

  document.getElementById('sv-detail-title').textContent = sv.title;
  document.getElementById('sv-detail-meta').innerHTML =
    `<span class="sv-status ${isOpen?'open':'closed'}">${isOpen?'受付中':'終了'}</span>
     <span style="margin-left:8px">【${tableLabel}】</span>
     <span style="margin-left:8px">終了: ${formatDateTime(sv.deadline)}</span>`;

  // メンバーバナー
  const statusBar = document.getElementById('sv-detail-status-bar');
  let bannerHtml = '';
  if(member && isOpen){
    bannerHtml = `<div class="sv-member-banner">
      <span style="font-size:12px">投票者：</span>
      <span class="sv-member-banner-name">${esc(member.name)}</span>
    </div>`;
  }
  if(!isOpen){
    bannerHtml += `<div style="background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC;border-radius:8px;padding:8px 12px;font-size:12px">
      ⏹ このアンケートは終了しました。${(currentRole==='admin'||currentRole==='reinf-admin')?'結果を援軍表に反映できます。':''}</div>`;
  }
  statusBar.innerHTML = bannerHtml;

  // ペア一覧（得票数順）- 同票は同順位
  const sorted = [...(sv.pairs||[])].sort((a,b)=>(b.votes||0)-(a.votes||0));
  // 同票同順位の計算
  const rankOf = [];
  for(let idx = 0; idx < sorted.length; idx++){
    if(idx === 0){ rankOf.push(1); continue; }
    const sameAsAbove = (sorted[idx].votes||0) === (sorted[idx-1].votes||0);
    rankOf.push(sameAsAbove ? rankOf[idx-1] : idx+1);
  }
  const pairsList = document.getElementById('sv-pairs-list');

  if(!sorted.length){
    pairsList.innerHTML = '<div class="empty" style="padding:.75rem">まだペアがありません</div>';
  } else {
    pairsList.innerHTML = sorted.map((p, idx) => {
      const rank = rankOf[idx];
      const rankClass = rank===1?'rank1':rank===2?'rank2':rank===3?'rank3':'';
      const isPending = _pendingVotes.has(p.id);
      const isConfirmed = _confirmedVotes.has(p.id);
      const isTop = idx===0 && (p.votes||0)>0;

      // チェックアイコン
      let checkHtml = '';
      if(canInteract){
        if(isConfirmed && isPending) checkHtml = `<div class="sv-check confirmed">✓</div>`;
        else if(isPending) checkHtml = `<div class="sv-check on">✓</div>`;
        else checkHtml = `<div class="sv-check"></div>`;
      }

      // 受付中はタップで仮選択、終了後はタップで投票者表示
      const clickAction = canInteract
        ? `togglePendingVote(${sv.id},${p.id})`
        : !isOpen ? `showVotersPopup(${sv.id},${p.id})` : '';

      return `<div class="sv-pair-item${isTop&&!isOpen?' top':''}${isPending?' pending':''}" onclick="${clickAction}">
        <div class="sv-pair-rank ${rankClass}">${rank}位</div>
        <div class="sv-pair-vote">
          <div class="sv-pair-vote-num">${p.votes||0}</div>
          <div class="sv-pair-vote-label">票</div>
        </div>
        <div class="sv-pair-names" style="font-size:13px;font-weight:500">${pairName(p)}</div>
        ${isOpen ? checkHtml : `<span style="font-size:10px;color:var(--t3)">▶ 詳細</span>`}
      </div>`;
    }).join('');
  }

  // 投票確定ボタン（受付中 かつ 仮選択が確定済みと異なるときだけ表示）
  const confirmArea = document.getElementById('sv-vote-confirm-area');
  if(canInteract){
    const hasChange = [..._pendingVotes].some(id => !_confirmedVotes.has(id)) ||
                      [..._confirmedVotes].some(id => !_pendingVotes.has(id));
    confirmArea.style.display = hasChange ? 'block' : 'none';
  } else {
    confirmArea.style.display = 'none';
  }

  document.getElementById('sv-add-pair-area').style.display = canInteract ? 'block' : 'none';

  const applyArea = document.getElementById('sv-apply-area');
  applyArea.style.display = (currentRole==='admin'||currentRole==='reinf-admin') ? 'block' : 'none';

  // 投票者一覧（終了後のみ非同期で表示）
  const existingSection = document.getElementById('sv-voters-section');
  if(existingSection) existingSection.remove();
  if(!isOpen){
    fetchAndRenderVoters(sv.id);
  }
}

/* ---------- 投票者一覧の取得・描画（終了後のみ呼ばれる） ---------- */
async function fetchAndRenderVoters(svId){
  try {
    const res = await fetch(`/api/surveys?action=voters&id=${svId}`);
    if(!res.ok) return;
    const voters = await res.json();
    renderVotersList(voters);
  } catch(e){ /* silent */ }
}

function renderVotersList(voters){
  let section = document.getElementById('sv-voters-section');
  const detailView = document.getElementById('sv-detail-view');
  if(!section){
    section = document.createElement('div');
    section.id = 'sv-voters-section';
    section.className = 'sv-voters-section';
    detailView.appendChild(section);
  }
  if(!voters || !voters.length){
    section.innerHTML = `<div class="sv-voters-title">📋 投票者一覧</div>
      <div class="empty" style="font-size:12px;padding:.5rem 0">まだ投票がありません</div>`;
    return;
  }
  const rows = voters.map(v => {
    return `<div class="sv-voter-row">
      <div class="sv-voter-name">${esc(v.memberName)}</div>
    </div>`;
  }).join('');
  section.innerHTML = `<div class="sv-voters-title">📋 投票者一覧 <span style="font-weight:400;color:var(--t3)">(${voters.length}名)</span></div>${rows}`;
}

/* ---------- 仮選択（LINEスタイル） ---------- */
function togglePendingVote(svId, pairId){
  const member = getSvMember();
  if(!member){ toast('ログインしていません'); return; }
  if(_pendingVotes.has(pairId)) _pendingVotes.delete(pairId);
  else _pendingVotes.add(pairId);

  const sv = _surveys.find(s => s.id === svId);
  if(sv) renderSurveyDetail(sv);
}

/* ---------- 投票確定 ---------- */
async function confirmVotes(){
  const member = getSvMember();
  if(!member){ toast('ログインしていません'); return; }
  const sv = _surveys.find(s => s.id === _activeSurveyId);
  if(!sv) return;

  const isOpen = new Date(sv.deadline).getTime() > Date.now();
  if(!isOpen){ toast('このアンケートは終了しています'); return; }

  // 追加する票と削除する票を計算
  const toAdd = [..._pendingVotes].filter(id => !_confirmedVotes.has(id));
  const toRemove = [..._confirmedVotes].filter(id => !_pendingVotes.has(id));

  if(toAdd.length === 0 && toRemove.length === 0){
    toast('変更がありません'); return;
  }

  showLoading();
  try {
    // 追加
    for(const pairId of toAdd){
      await fetch('/api/surveys?action=vote', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ surveyId: sv.id, pairId, memberId: member.id, memberName: member.name }),
      });
    }
    // 削除（同じペアに再投票→取消）
    for(const pairId of toRemove){
      await fetch('/api/surveys?action=vote', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ surveyId: sv.id, pairId, memberId: member.id, memberName: member.name }),
      });
    }
    toast('投票しました');
    await fetchAndRenderDetail(sv.id);
  } catch(e){
    toast('投票に失敗しました');
  } finally {
    hideLoading();
  }
}

/* ---------- 投票者ポップアップ（ペアタップ時） ---------- */
async function showVotersPopup(svId, pairId){
  // オーバーレイ作成
  const overlay = document.createElement('div');
  overlay.className = 'sv-voters-overlay';
  overlay.onclick = () => { overlay.remove(); popup.remove(); };
  document.body.appendChild(overlay);

  const popup = document.createElement('div');
  popup.className = 'sv-voters-popup';
  popup.innerHTML = '<div class="sv-voters-popup-title">読み込み中...</div>';
  document.body.appendChild(popup);

  try {
    const res = await fetch(`/api/surveys?action=voters&id=${svId}`);
    if(!res.ok) throw new Error();
    const voters = await res.json();

    const sv = _surveys.find(s => s.id === svId);
    const pair = (sv?.pairs||[]).find(p => p.id === pairId);
    const pairLabel = pair ? pairName(pair) : '';

    const names = voters
      .filter(v => (v.pairIds||[]).includes(pairId))
      .map(v => v.memberName);

    popup.innerHTML = `
      <div class="sv-voters-popup-title">${pairLabel}</div>
      <div class="sv-voters-popup-list">
        ${names.length ? names.map(n=>`✓ ${n}`).join('<br>') : 'まだ投票がありません'}
      </div>
      <button class="sv-voters-popup-close" onclick="this.closest('.sv-voters-popup').remove();document.querySelector('.sv-voters-overlay').remove()">閉じる</button>`;
  } catch(e){
    popup.innerHTML = `<div class="sv-voters-popup-title">読み込み失敗</div>
      <button class="sv-voters-popup-close" onclick="this.closest('.sv-voters-popup').remove();document.querySelector('.sv-voters-overlay').remove()">閉じる</button>`;
  }
}

/* ---------- ペア追加 ---------- */
function openAddPairModal(){
  openModal('add-pair', `<h3>ペアを追加</h3>
    <div class="field"><label>大将</label>${comboHtml('ap-main', S.chars, '', '（なし）')}</div>
    <div class="field"><label>副将</label>${comboHtml('ap-sub', S.chars, '', '（なし）')}</div>
    <div style="font-size:11px;color:var(--danger);min-height:14px" id="ap-err"></div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn pri" id="ap-add-btn" onclick="doAddPair()">追加</button>
    </div>`);
  initCombo('ap-main', S.chars, '');
  initCombo('ap-sub', S.chars, '');
}
async function doAddPair(){
  const main = document.getElementById('ap-main')?.value || '';
  const sub = document.getElementById('ap-sub')?.value || '';
  const errEl = document.getElementById('ap-err');
  const btn = document.getElementById('ap-add-btn');
  if(!main && !sub){ errEl.textContent = '大将か副将を選択してください'; return; }
  btn.disabled = true; btn.textContent = '追加中...';
  try {
    const res = await fetch(`/api/surveys?id=${_activeSurveyId}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ main: main||null, sub: sub||null }),
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error||'追加に失敗しました'; btn.disabled=false; btn.textContent='追加'; return; }
    closeModal();
    toast('ペアを追加しました');
    await fetchAndRenderDetail(_activeSurveyId);
    // 追加したペアを自動で仮選択（チェック）状態にする
    const sv = _surveys.find(s => s.id === _activeSurveyId);
    if(sv){
      const newPair = (data && data.id != null)
        ? (sv.pairs||[]).find(p => p.id === data.id)
        : [...(sv.pairs||[])].reverse().find(p => (p.main||'') === main && (p.sub||'') === sub);
      if(newPair){
        _pendingVotes.add(newPair.id);
        renderSurveyDetail(sv);
      }
    }
  } catch(e){
    errEl.textContent = 'エラーが発生しました'; btn.disabled=false; btn.textContent='追加';
  }
}

function openEditSurvey(){
  const sv = _surveys.find(s => s.id === _activeSurveyId);
  if(!sv) return;
  const localDeadline = new Date(new Date(sv.deadline).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  openModal('sv-edit', `<h3>アンケート編集</h3>
    <div class="field"><label>タイトル</label><input type="text" id="sv-edit-title" value="${esc(sv.title)}" style="font-size:16px"></div>
    <div class="field"><label>終了日時</label><input type="datetime-local" id="sv-edit-deadline" value="${localDeadline}" style="font-size:16px"></div>
    <div style="font-size:11px;color:var(--danger);min-height:14px" id="sv-edit-err"></div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn pri" id="sv-edit-save-btn" onclick="doEditSurvey()">保存</button>
    </div>`);
}

async function doEditSurvey(){
  const title = (document.getElementById('sv-edit-title').value||'').trim();
  const deadlineLocal = document.getElementById('sv-edit-deadline').value;
  const errEl = document.getElementById('sv-edit-err');
  const btn = document.getElementById('sv-edit-save-btn');
  if(!title){ errEl.textContent = 'タイトルを入力してください'; return; }
  if(!deadlineLocal){ errEl.textContent = '終了日時を設定してください'; return; }
  const deadline = new Date(deadlineLocal).toISOString();
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const res = await fetch(`/api/surveys?id=${_activeSurveyId}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, deadline }),
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error||'保存に失敗しました'; btn.disabled=false; btn.textContent='保存'; return; }
    const sv = _surveys.find(s => s.id === _activeSurveyId);
    if(sv){ sv.title = title; sv.deadline = deadline; }
    closeModal();
    toast('アンケートを更新しました');
    renderSurveyDetail(_surveys.find(s => s.id === _activeSurveyId));
  } catch(e){
    errEl.textContent = 'エラーが発生しました'; btn.disabled=false; btn.textContent='保存';
  }
}

/* ---------- アンケート削除 ---------- */
function deleteSurvey(){
  openModal('sv-delete-confirm', `<h3>アンケートを削除</h3>
    <div style="font-size:12px;margin-bottom:14px">このアンケートを削除します。<br>投票データも全て削除されます。元に戻せません。</div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn danger" onclick="doDeleteSurvey()">削除する</button>
    </div>`);
}
async function doDeleteSurvey(){
  closeModal(); showLoading();
  try {
    const res = await fetch(`/api/surveys?id=${_activeSurveyId}`, { method: 'DELETE' });
    if(!res.ok) throw new Error();
    _surveys = _surveys.filter(s => s.id !== _activeSurveyId);
    toast('アンケートを削除しました');
    closeSurveyDetail();
  } catch(e){ toast('削除に失敗しました'); }
  finally { hideLoading(); }
}

/* ---------- 援軍表への反映 ---------- */
function applySurveyToReinf(){
  const sv = _surveys.find(s => s.id === _activeSurveyId);
  if(!sv) return;
  if(!sv.pairs||!sv.pairs.length){ toast('ペアがありません'); return; }
  const isOpen = new Date(sv.deadline).getTime() > Date.now();

  const sortedPairs = [...sv.pairs].sort((a,b)=>(b.votes||0)-(a.votes||0));
  const tableType = sv.tableType;
  const tableLabel = tableType === 'ransaki' ? '乱咲' : '蕾';
  const existingRows = S.reinf.filter(r=>(r.tableType||'ransaki')===tableType);

  const pairsPreview = sortedPairs.map((p,i)=>
    `<div style="padding:3px 0;border-bottom:1px solid var(--border)">
      ${i+1}行目：${pairName(p)}<span style="color:var(--t3);font-size:10px;margin-left:4px">${p.votes||0}票</span>
    </div>`
  ).join('');

  openModal('apply-confirm', `<h3>援軍表に反映</h3>
    <div style="font-size:12px;margin-bottom:12px">
      ${isOpen ? '<div style="background:#FAEEDA;color:#633806;border:1px solid #FAC775;border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:11px">⚠️ まだ受付中です。このまま反映しますか？</div>' : ''}
      【${tableLabel}】援軍表の<strong>全行を削除</strong>し、以下の${sortedPairs.length}行を新規作成します。<br><br>
      <div style="margin:8px 0;max-height:200px;overflow-y:auto">${pairsPreview}</div>
      ${existingRows.length>0?`<span style="color:var(--danger)">※ 既存の行が削除されます</span>`:''}
    </div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn pri" onclick="doApplySurvey('${tableType}')">反映する</button>
    </div>`);
}

async function doApplySurvey(tableType){
  closeModal();
  const sv = _surveys.find(s => s.id === _activeSurveyId);
  if(!sv) return;
  const sortedPairs = [...sv.pairs].sort((a,b)=>(b.votes||0)-(a.votes||0));
  showLoading();
  try {
    const targetRows = S.reinf.filter(r=>(r.tableType||'ransaki')===tableType);
    await Promise.all(targetRows.map(r => fetch(`/api/reinf?id=${r.id}`, { method: 'DELETE' })));
    for(const pair of sortedPairs){
      const addRes = await fetch('/api/reinf', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tableType }),
      });
      if(!addRes.ok) throw new Error();
      const newRow = await addRes.json();
      await fetch(`/api/reinf?id=${newRow.id}`, {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ memberName:null, normalMain:pair.main||null, normalSub:pair.sub||null, castleMain:pair.main||null, castleSub:pair.sub||null }),
      });
    }
    toast('援軍表に反映しました');
    await load();
  } catch(e){ toast('反映に失敗しました'); }
  finally { hideLoading(); }
}

// ログイン画面：スマホでソフトウェアキーボードが出た時に入力欄が隠れないようにする
(function(){
  const screen = document.getElementById('login-screen');
  if(!window.visualViewport){ return; } // 非対応ブラウザは従来通り（中央表示）
  const vv = window.visualViewport;
  function onViewportChange(){
    // レイアウトビューポートとの差分からキーボードの高さを推定
    const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
    const kbOpen = keyboardHeight > 100;
    screen.classList.toggle('kb-open', kbOpen);
    if(kbOpen){
      const active = document.activeElement;
      if(active && screen.contains(active) && active.tagName === 'INPUT'){
        requestAnimationFrame(() => {
          active.scrollIntoView({ block: 'center', behavior: 'smooth' });
        });
      }
    }
  }
  vv.addEventListener('resize', onViewportChange);
  vv.addEventListener('scroll', onViewportChange);
})();

// roleのみメモリ上に保持してUI制御に使う
 (async function restoreSession(){
  try {
    const res = await fetch('/api/init');
    if(res.ok){
      const d = await res.json();
      currentRole = d.role;
      currentMemberId = d.memberId || null;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-wrap').style.display = '';
      applyRole();
      load();
    }
  } catch(e) {
  }
})();

async function doLogin(){
  const memberId = parseInt(document.getElementById('login-id').value);
  const pw = (document.getElementById('login-pw').value || '').trim();
  const errEl = document.getElementById('login-error');
  const btn = document.querySelector('#login-screen button');
  if(!memberId){ errEl.textContent = 'IDを入力してください'; return; }
  if(!pw){ errEl.textContent = 'パスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = '確認中...'; errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ memberId, password: pw })
    });
    const data = await res.json();
    if(!res.ok || !data.role){
      errEl.textContent = data.error || 'パスワードが違います';
      return;
    }
    currentRole = data.role;
    currentMemberId = data.memberId;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-wrap').style.display = '';
    applyRole();
    load();
  } catch(e) {
    errEl.textContent = 'エラーが発生しました';
  } finally {
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
}

async function doLogout(){
  await fetch('/api/auth/logout', { method: 'POST' }).catch(()=>{});
  currentRole = null;
  currentMemberId = null;
  const idEl = document.getElementById('login-id'); if(idEl) idEl.value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('main-wrap').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.querySelectorAll('.tab').forEach((t,i) => { t.classList.toggle('active', i===0); });
  document.querySelectorAll('.page').forEach((p,i) => { p.classList.toggle('active', i===0); });
}

function applyRole(){
  const isAdmin      = currentRole === 'admin';
  const isReinfAdmin = currentRole === 'reinf-admin';
  const isUser       = currentRole === 'user';

  // 管理者のみ表示
  document.querySelectorAll('.admin-only').forEach(el => {
    el.style.display = isAdmin ? '' : 'none';
  });
  // 育成入力の追加・編集ボタン（管理者のみ）
  document.querySelectorAll('.input-admin-only').forEach(el => {
    el.style.display = isAdmin ? '' : 'none';
  });
  // 援軍表タブ（管理者 or 援軍管理者）
  document.querySelectorAll('.reinf-admin-only').forEach(el => {
    el.style.display = (isAdmin || isReinfAdmin) ? '' : 'none';
  });

  // 援軍表の編集操作（管理者 or 援軍管理者のみ）
  document.querySelectorAll('.reinf-edit-only').forEach(el => {
    el.style.display = (isAdmin || isReinfAdmin) ? '' : 'none';
  });

  // ロールバッジ
  const badgeClass = isAdmin ? 'admin' : isReinfAdmin ? 'reinf-admin' : 'user';
  const badgeLabel = isAdmin ? '管理者' : isReinfAdmin ? '援軍管理者' : '利用者';
  document.getElementById('role-badge-wrap').innerHTML =
    `<span class="role-badge ${badgeClass}">${badgeLabel}</span>`;
}



async function saveUserPassword(){
  const role = document.getElementById('cpw-role').value;
  const nw = (document.getElementById('cpw-new').value || '').trim();
  const cf = (document.getElementById('cpw-confirm').value || '').trim();
  const errEl = document.getElementById('cpw-err');
  if(!nw){ errEl.textContent = 'パスワードを入力してください'; return; }
  if(nw !== cf){ errEl.textContent = '確認パスワードが一致しません'; return; }
  if(nw.length < 4){ errEl.textContent = '4文字以上で設定してください'; return; }
  showLoading();
  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ role, password: nw })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || '変更に失敗しました'; return; }
    closeModal();
    const label = role === 'reinf-admin' ? '援軍管理者' : '利用者';
    toast(`${label}パスワードを変更しました`);
  } catch(e) {
    errEl.textContent = 'エラーが発生しました';
  } finally {
    hideLoading();
  }
}
